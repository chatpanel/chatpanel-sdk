          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "The detector is not ready (`detector_unready`, `detector_error`)\
            \ or the budget cannot be met (`over_budget`, with `predictedMs` and `budgetMs`)."
      summary: "Find entities in text — the model's own labels, with offsets and scores."
      tags:
      - capabilities
      x-chatpanel-auth: open
      x-chatpanel-since: 0.13.0
      x-chatpanel-scope: "the request text, in this process"
  /v1/search:
    post:
      description: |
        The `search` capability (docs/web-retrieval.md §4.1). Providers are listed by
        `GET /v1/capabilities`: `serp` (a results page fetched and read with the shared rules —
        no install, the default) and `searxng` (the user's own metasearch, preferred the moment it
        answers). `read: N` reads the top N results in parallel in this request, each carrying a
        §4.2 document under `read` — one round-trip instead of 1 + N; a page that will not be read
        keeps its snippet with `read.restricted.reason`. The query goes through layer-1 redaction
        (emails, cards, keys, dictionary terms — never the name detector) before it leaves; what
        was replaced is dropped and `redacted: true` says so; a query with nothing left is 400
        `unsafe_query`. `freshness` and `lang` are honoured by SearXNG; `site` by both. `budgetMs`
        covers the search and its reads and is refused (503 `over_budget`) from the provider's
        record. `engines` names what was actually asked, so an empty list can be told from a
        blocked one.
      operationId: retrieval.search
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebSearchRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebSearchResponse"
          description: "Ranked results — possibly none, with `engines` naming what\
            \ was asked."
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "A bad body (`invalid_request`), or a query that was only private\
            \ values (`unsafe_query`)."
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: The named provider is not available here (`provider_not_found`).
        "502":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: The provider failed (`provider_failed` — a SearXNG 403/429
            names the settings fix).
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: The budget cannot be met (`over_budget`).
        "504":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: The provider did not answer within the budget (`fetch_timeout`).
      summary: Search the web through the provider this gateway is configured with;
        optionally read the top results in the same request.
      tags:
      - retrieval
      x-chatpanel-auth: open
      x-chatpanel-since: 0.15.0
      x-chatpanel-scope: "the query (after layer-1 redaction), to the configured provider;\
        \ the top pages when `read` is set"
  /v1/search/{q}:
    get:
      description: |
        Same search as `POST /v1/search` with `read: 5` (`?read=N`, 0–10, changes it), answered
        in the shape the shipped ChatPanel extension's *Web search API* engine already reads:
        `{ code, status, data: [{ url, title, description, content, publishedTime? }] }` where
        `content` is the page's Markdown when it was read and the snippet otherwise — nothing
        needs fetching on the client. A Bearer token is accepted and ignored.
      operationId: retrieval.searchAlias
      parameters:
      - description: "The query, percent-encoded."
        explode: false
        in: path
        name: q
        required: true
        schema:
          maxLength: 1024
          type: string
        style: simple
      - explode: true
        in: query
        name: read
        required: false
        schema:
          default: 5
          maximum: 10
          minimum: 0
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/retrieval_searchAlias_200_response"
          description: The results with content.
        "400":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"
      summary: The s.jina.ai-shaped alias — `GET /v1/search/<query>` — the top results
        WITH their content.
      tags:
      - retrieval
      x-chatpanel-auth: open
      x-chatpanel-since: 0.15.0
      x-chatpanel-scope: "the query (after layer-1 redaction), to the configured provider;\
        \ the top pages"
  /v1/extract:
    post:
      description: |
        The `extract` capability (docs/capability-endpoints.md): the third leg beside `search`
        and `read`. Two calls on one route. With `name` and `data` (the file, base64), the
        document is parsed in a worker process on this machine — no network, the vault
        unreadable — and the answer is its identity (`hash`, SHA-256 of the bytes), its `type`
        as read from the bytes, its `title` when it has one and how many `pages` it has; the
        text stays on the server. With `hash` and `page`, one page's text comes back; the
        bytes crossed once. A page is the format's own unit (a PDF page, a slide, a sheet) or,
        for a document with none (DOCX, Markdown, text), a run of ~6,000 characters cut at a
        heading. Readers: PDF (pdf.js, the text layer — a scanned document is `scanned: true`
        with empty pages, never OCR'd), DOCX (Markdown), XLSX/ODS (rows of cells), PPTX/ODP
        (a slide per page, speaker notes appended), ODT, Markdown, text, CSV, HTML. A hash the
        worker no longer holds (it is dropped when idle) is a 404 `unknown_document`: send the
        bytes again. `budgetMs` is refused (503 `over_budget`) from the worker's own record.
      operationId: retrieval.extract
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtractRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractResponse"
          description: "The document opened (hash, type, pages) — or, with `page`,\
            \ that page's text."
        "400":
          $ref: "#/components/responses/Error"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: The hash is not open in the worker (`unknown_document`) — send
            the bytes again.
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: The document is over the 64 MB limit (`too_large`).
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: No reader for these bytes (`unsupported`).
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "The budget cannot be met (`over_budget`, with `predictedMs`)."
        "504":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: The parse took too long and the worker was restarted (`extract_timeout`).
      summary: "A document's pages from its bytes — a PDF, a Word file, a sheet, a\
        \ deck — parsed once, paged by hash."
      tags:
      - retrieval
      x-chatpanel-auth: open
      x-chatpanel-since: 0.16.0
      x-chatpanel-scope: "one document, parsed on this machine, never sent anywhere"
  /v1/read:
    post:
      description: |
        The `read` capability (docs/web-retrieval.md §4.2). The page is fetched from this
        machine as the user's agent — public web only (the shared SSRF guard, re-checked
        where a redirect lands), a browser User-Agent, no cookies — and turned into Markdown
        that keeps headings, lists, tables, code and links. `url` in the answer is where the
        page should be CITED: the same-origin canonical when it declares one, else where the
        fetch landed; `sections` are the page's own heading ids with their offset into the
        content so a citation can point at `url#section`. A page that could not be read as
        the article — a login wall, a paywall, a 429 — is a 200 with `restricted.reason` and
        the caller's `snippet` standing in for the content, never the wall rendered as prose.
        `maxChars` cuts at a section boundary. A read is served from this process's page
        cache when fresh (`cached: true`), revalidated with its ETag when stale. `budgetMs`
        is refused (503 `over_budget`) from the provider's own record, never missed. Providers
        are listed by `GET /v1/capabilities`: `defuddle` (in-process), `text` (the DOM-less
        fallback), `remote` (an `r.jina.ai`-shaped reader configured under `read.remote`).
      operationId: retrieval.read
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReadRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadResponse"
          description: "The page — or, with `restricted` set, the reason it was not\
            \ read and the snippet in its place."
        "400":
          $ref: "#/components/responses/Error"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: The named provider is not available here (`provider_not_found`).
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: The page is not HTML or text (`unsupported_content`).
        "502":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "The page could not be fetched (`fetch_failed`), or its host\
            \ — or where it redirected — is not public web (`blocked_host`)."
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "The budget cannot be met (`over_budget`, with `predictedMs`\
            \ and `budgetMs`)."
        "504":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: The page did not answer within the budget (`fetch_timeout`).
      summary: "Read one public page as LLM-ready Markdown, cited where it landed,\
        \ with its sections."
      tags:
      - retrieval
      x-chatpanel-auth: open
      x-chatpanel-since: 0.14.0
      x-chatpanel-scope: "one public page, fetched on request"
  /v1/read/{url}:
    get:
      description: |
        Same read as `POST /v1/read`, addressed the way the shipped ChatPanel extension's
        *reader service* slot (and anything else built for `r.jina.ai`) already addresses a
        reader: the page URL appended to the base, as is or percent-encoded, with its own
        query string kept. Answers `text/plain` with `Title:` / `URL Source:` / `Published
        Time:` header lines, a blank line and `Markdown Content:`; under
        `Accept: application/json` the §4.2 document wrapped as `{ code, status, data }`.
        `X-Return-Format: text` selects the text form. A Bearer token is accepted and ignored.
      operationId: retrieval.readAlias
      parameters:
      - description: "The page URL, as is or percent-encoded."
        explode: false
        in: path
        name: url
        required: true
        schema:
          maxLength: 4096
          type: string
        style: simple
      - description: '`application/json` for the document; text otherwise.'
        explode: false
        in: header
        name: Accept
        required: false
        schema:
          type: string
        style: simple
      - explode: false
        in: header
        name: X-Return-Format
        required: false
        schema:
          enum:
          - markdown
          - text
          type: string
        style: simple
      responses:
        "200":
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                $ref: "#/components/schemas/retrieval_readAlias_200_response"
          description: The page.
        "400":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"
      summary: The r.jina.ai-shaped alias — `GET /v1/read/https://…` — for clients
        that already speak it.
      tags:
      - retrieval
      x-chatpanel-auth: open
      x-chatpanel-since: 0.14.0
      x-chatpanel-scope: "one public page, fetched on request"
