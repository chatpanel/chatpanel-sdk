  /v1/detect:
    post:
      description: |
        The standard `detect` signature over the in-process entity detector. Labels are the
        model's own (`private_person`, `PER`, `GIVENNAME`…) — the client maps them; the
        vocabulary is listed by `GET /v1/capabilities`. `budgetMs` is refused (503
        `over_budget`) from the provider's own latency record before the model runs, never
        missed. An engine that is still loading answers 503 `detector_unready`; an empty
        `entities` on 200 means the model found nothing. Raw text reaches the model here and
        nowhere else — this route is loopback-only like the rest of the gateway.
      operationId: capabilities.detect
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DetectRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectResponse"
