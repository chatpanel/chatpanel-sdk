  /v1/capabilities:
    get:
      description: |
        The discovery document a client chooses a provider from: one entry per capability
        (`detect`, `stt`, `tts` today; `decide`, `rerank`, `embed` as they land), each at its
        standard route, with the models it can serve, the loaded model's own label vocabulary
        (`detect`), the measured latency record, and the runtime's state. Never loads a model.
      operationId: capabilities.list
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesDocument"
          description: The provider's capabilities.
      summary: "What this provider can do — which capabilities, models, measured cost\
        \ and runtime state."
      tags:
      - capabilities
      x-chatpanel-auth: open
      x-chatpanel-since: 0.13.0
  /v1/runtime:
    get:
      description: |
        One document for Settings › Runtime. `sandbox` is the bridge's own (`/health.sandbox`:
        enabled, mode `open` | `allowlist` | `none`, the runtime found, the reason when none,
        the global `extras`, whether a process can get a session of its own, and `refused` —
        the last hosts any process was refused, names only). `processes` lists every local
        MCP server running for the user with its sandbox record and the hosts it was refused,
        and the warm agent processes. `engines` says which container engine exists (`podman`
        first, `docker`) and whether it can run a container now; when none does, `install`
        carries the command for this platform — shown to the person, never run by the gateway.
        `services` is the catalogue: `searxng` with its state (`no-engine` | `engine-stopped`
        | `absent` | `stopped` | `running`), its loopback URL and whether it answers.
      operationId: runtime.status
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeDocument"
          description: The runtime document.
      summary: "The runtime — the process sandbox, what is running now, the container\
        \ engine, the services."
      tags:
      - runtime
      x-chatpanel-auth: open
      x-chatpanel-since: 0.19.0
  /v1/runtime/recipe:
    get:
      description: |
        For llama.cpp: the repo's file list read from Hugging Face, and 64 KB of one weights
        file's header for its architecture. Answers the quant picked (Q4_K_M when none is named),
        every quant with its size and whether it fits in about three quarters of the machine's
        memory, the vision projector and the speculative-decoding draft the repo ships (with the
        `--spec-type` its name means), and the layout chosen — `alt` when the repo also carries
        the weights as `.gguf_file` and only that layout is one the installed llama.cpp knows. A
        repo whose architecture the installed llama.cpp cannot load is a 400 with
        `code: unsupported_arch`. Nothing is saved; a start pulls the same recipe.
      operationId: runtime.recipe
      parameters:
      - explode: true
        in: query
        name: service
        required: false
        schema:
          default: llama
          maxLength: 32
          type: string
        style: form
      - description: "A Hugging Face owner/name, or owner/name:QUANT."
        explode: true
        in: query
        name: model
        required: true
        schema:
          maxLength: 256
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeRecipe"
          description: The recipe.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeActionResult"
          description: "Not llama.cpp, not a Hugging Face id, no such quant, or an\
            \ architecture the installed llama.cpp cannot load (`code: unsupported_arch`)."
        "403":
          description: Neither the extension's origin nor the gateway token.
      security:
      - gatewayToken: []
      - tokenHeader: []
      summary: "What a GGUF repo runs as on this machine, before anything is downloaded."
      tags:
      - runtime
      x-chatpanel-auth: token
      x-chatpanel-since: 0.122.0
  /v1/runtime/plan:
    get:
      description: |
        Checked against what Heatwatch (an optional macOS tool on `127.0.0.1:7878`) says is
        reclaimable NOW, with the apps to close when it is short — or, without Heatwatch, against
        the machine's total memory, and `source` says which (`heatwatch` | `total-memory`). The
        KV cache is counted from the model's `config.json` when it is in the gateway's model
        cache (`contextCounted` says whether it was). A model the catalogue does not list needs
        `need_mb`. A native service's start makes the same check and refuses a model that does
        not fit what is free, unless the start says `force: true`. `runtime.heatwatch: false`
        stops the gateway asking Heatwatch.
      operationId: runtime.plan
      parameters:
      - explode: true
        in: query
        name: service
        required: false
        schema:
          default: mlx
          maxLength: 32
          type: string
        style: form
      - description: A catalogue id or a Hugging Face owner/name; the service's current
          model when absent.
        explode: true
        in: query
        name: model
        required: false
        schema:
          maxLength: 256
          type: string
        style: form
      - description: The context in tokens; the service's own window when absent.
        explode: true
        in: query
        name: ctx
        required: false
        schema:
          minimum: 1
          type: integer
        style: form
      - description: "The model's peak memory while serving, for a model the catalogue\
          \ does not list."
        explode: true
        in: query
        name: need_mb
        required: false
        schema:
          minimum: 1
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimePlan"
          description: The plan.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeActionResult"
          description: "Unknown service, a service that takes no model, or an unlisted\
            \ model without `need_mb`."
      summary: "Will this local model run now? Weights + the KV cache for the context\
        \ + 10% headroom, against what is free."
      tags:
      - runtime
      x-chatpanel-auth: open
      x-chatpanel-since: 0.74.0
  /v1/runtime/engines/{name}:
    post:
      description: |
        `{ action: 'start' }`. Podman on macOS and Windows runs containers in a machine: made
        on first start (`podman machine init`), then started. Linux Podman is rootless and
        needs nothing. Docker is not started by the gateway — the response says so.
      operationId: runtime.engine
      parameters:
      - explode: false
        in: path
        name: name
        required: true
        schema:
          enum:
          - podman
          - docker
          maxLength: 16
          type: string
        style: simple
      requestBody:
