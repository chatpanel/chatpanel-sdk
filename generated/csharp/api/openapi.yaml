      x-chatpanel-scope: partner devices
    put:
      description: |
        The body is the file's bytes. Refused (400): a path outside what a partner may hold
        (`.claude/settings*.json`, hooks, `.mcp.json`, `.codex/` among them), and a skill or subagent
