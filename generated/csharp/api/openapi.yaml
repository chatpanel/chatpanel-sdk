components:
  parameters:
    RunId:
      explode: false
      in: path
      name: runId
      required: true
      schema:
        pattern: "^[a-zA-Z0-9_-]{4,64}$"
        type: string
      style: simple
    ProjectId:
      explode: false
      in: path
      name: projectId
      required: true
      schema:
        pattern: "^[a-zA-Z0-9_-]{1,64}$"
        type: string
      style: simple
    JobId:
      explode: false
      in: path
      name: jobId
      required: true
      schema:
        pattern: "^[a-zA-Z0-9_-]{1,64}$"
        type: string
      style: simple
    RedactionHeader:
      description: "Turn redaction off for this turn — honoured only from a token-bearing\
        \ caller (0.6.69+), recorded in the trace."
      explode: false
      in: header
      name: X-ChatPanel-Redaction
      required: false
      schema:
        enum:
        - false
        type: string
      style: simple
    RunHeader:
      description: A team role's run context (URL-encoded JSON) for the bridge (0.6.89+).
        Never a token.
      explode: false
      in: header
      name: X-ChatPanel-Run
      required: false
      schema:
        type: string
      style: simple
  responses:
    Error:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: "An error, in the gateway's words."
    Forbidden:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: The caller lacks the token this route needs.
    Removed:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/prefs_delete_200_response"
      description: Whether the record existed.
    TeamRunResult:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/inline_object"
      description: The run as it now stands.
    ProjectResult:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/inline_object_1"
      description: The project as it now stands.
  schemas:
    AnyObject:
      additionalProperties: true
      description: A domain object whose shape is owned by `@chatpanel/events`; the
        SDK carries it as-is.
      type: object
    ErrorResponse:
      example:
        error: ErrorResponse_error
      properties:
        error:
          $ref: "#/components/schemas/ErrorResponse_error"
      required:
      - error
    Health:
      additionalProperties: true
      example:
        ok: true
        version: version
        backend: backend
        tier: basic
        pairing: true
        managed:
          key: ""
        managedBy: managedBy
        bridge:
          key: ""
        stt:
          key: ""
        tts:
          key: ""
      properties:
        ok:
          type: boolean
        version:
          description: The gateway's semver; every version gate reads this.
          type: string
        backend:
          type: string
        tier:
          description: Redaction tier.
          enum:
          - basic
          - full
          type: string
        pairing:
          description: Present from 0.9.0 — this gateway can pair a client.
          type: boolean
        managed:
          additionalProperties: true
          description: A domain object whose shape is owned by `@chatpanel/events`;
            the SDK carries it as-is.
          type: object
        managedBy:
          type: string
        bridge:
          additionalProperties: true
          description: A domain object whose shape is owned by `@chatpanel/events`;
            the SDK carries it as-is.
          type: object
        stt:
          additionalProperties: true
          description: A domain object whose shape is owned by `@chatpanel/events`;
            the SDK carries it as-is.
          type: object
        tts:
          additionalProperties: true
          description: A domain object whose shape is owned by `@chatpanel/events`;
            the SDK carries it as-is.
          type: object
      required:
      - ok
      - version
    WhoAmI:
      example:
        ok: true
        trust: token
        paired: true
        version: version
      properties:
        ok:
          type: boolean
        trust:
          enum:
          - token
          - pinned
          - unpaired
          - local
          - web
          type: string
        paired:
          description: True when this caller may reach token-gated routes.
          type: boolean
        version:
          type: string
      required:
      - ok
      - paired
      - trust
      - version
    PairingCode:
      example:
        ok: true
        code: code
        display: display
        expiresAt: 0
      properties:
        ok:
          type: boolean
        code:
          type: string
        display:
          type: string
        expiresAt:
          description: ms since epoch
          format: int64
          type: integer
      required:
      - code
      - expiresAt
      - ok
    Paired:
      example:
        ok: true
        token: token
        bridgeToken: bridgeToken
      properties:
        ok:
          type: boolean
        token:
          description: The gateway token. A secret — store it 0600 or in the platform
            keychain; never log it.
          type: string
        bridgeToken:
          description: The bridge's token when this machine has one.
          type: string
      required:
      - ok
      - token
    Audit:
      additionalProperties: true
      example:
        version: version
        startedAt: 0
      properties:
        version:
          type: string
        startedAt:
          format: int64
          type: integer
    Model:
      additionalProperties: true
      example:
        id: id
        object: model
        owned_by: owned_by
        provider: provider
        provider_type: agent
        api: api
        endpoints:
        - endpoints
        - endpoints
        available: true
        configured: true
        reason: reason
        tools: true
      properties:
        id:
