  /v1/link:
    get:
      description: |
        No keys, tokens or secrets. A partner device (gateway 0.89.0+) carries `kind: partner`, its
        `partner.name`, `scopes`, the `route` it was paired on and the `host` it connects to; a
        phone carries `kind: phone` and follows the gateway's route. Changing the route never
        moves a partner: one whose tunnel door shut with the route says `routeClosed`.
      operationId: link.status
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkStatus"
          description: The route and the devices.
        "403":
          $ref: "#/components/responses/Forbidden"
      security:
      - gatewayToken: []
      - tokenHeader: []
      summary: The Link route and every paired device — phones and partner servers
        — with what each may reach.
      tags:
      - link
      x-chatpanel-auth: token
      x-chatpanel-since: 0.60.0
      x-chatpanel-scope: paired devices
  /v1/link/pair:
    post:
      description: |
        **A phone** (no `kind`, or `kind: phone`): a room on the route's relay and the QR the phone
        scans; the answer carries `uri`, `svg`, `expiresAt`, `room`.

        **A partner server** (`kind: partner`, gateway 0.89.0+): nothing is issued without the
        owner's yes. Without `confirm: true` the answer is `{ confirmed: false, preview }` — what
        the partner will be able to do (scopes, agents yes/no), the route and the one host its
        server will connect to — and nothing is created. With `confirm: true` the answer adds the
        `code` (`cplink1.…`, one use, 10 minutes), `room`, `route` and `host`. The route is the
        gateway's own unless `route` names another; a tunnel route reaches the tunnel door with no
        relay at all, and ChatPanel's hosted relay is used only for `link`. Refused with 403 from a
        device on Link: a paired device never pairs another.
      operationId: link.pair
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkPairRequest"
        required: false
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkPairResult"
          description: "The phone's code, or the partner's preview (and, once confirmed,\
            \ its code)."
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
      security:
      - gatewayToken: []
      - tokenHeader: []
      summary: "Start a pairing — a phone's QR, or (with `kind partner`) a partner\
        \ server's one-time code, shown and confirmed first."
      tags:
      - link
      x-chatpanel-auth: token
      x-chatpanel-since: 0.60.0
      x-chatpanel-scope: paired devices
  /v1/link/route:
    post:
      description: "Checked, saved in the gateway's config and applied without a restart.\
