          application/json:
            schema:
              $ref: "#/components/schemas/runtime_engine_request"
        required: false
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeActionResult"
          description: Started
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeActionResult"
          description: Could not start; `install` when the engine is not installed.
        "403":
          $ref: "#/components/responses/Forbidden"
      security:
      - gatewayToken: []
      - tokenHeader: []
      summary: Start the container engine (Podman — creates and starts its machine
        where one is needed).
      tags:
      - runtime
      x-chatpanel-auth: token
      x-chatpanel-since: 0.19.0
  /v1/runtime/services/{id}:
    post:
      description: |
        `{ action: 'start' | 'stop' }`. `start` brings the engine up if it is not, runs the
        service's container from its kit (SearXNG: `127.0.0.1:8888`, JSON on, the limiter off,
        a random secret, capabilities dropped; `reranker` on 8889 and `opendecision` on 8890
        with the shared model cache mounted, gateway 0.20+) — the first start pulls the image
        — waits for it to answer, and sets the config that points the gateway at it
        (`search.searxng.url`; `capabilities.rerank` / `capabilities.decide`, so `/v1/rerank`
        and `/v1/decide` are served and listed). `stop` stops the container and clears what it
        set. `{ action: 'model', model }` (gateway 0.22+) picks the model a capability
        container runs — an id from its catalogue (`GET /v1/runtime` `services.<id>.models`)
        or a Hugging Face `owner/name` — gated by the container ENGINE's memory (a model it
        cannot hold is refused with the command that raises the ceiling); the container is
        re-created with the pick and restarted when it ran.
      operationId: runtime.service
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          enum:
          - searxng
          - reranker
          - opendecision
          maxLength: 32
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/runtime_service_request"
        required: false
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeActionResult"
          description: Done; `url` and `answering` on a start.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeActionResult"
          description: Could not; `install` when there is no engine.
        "403":
          $ref: "#/components/responses/Forbidden"
      security:
      - gatewayToken: []
      - tokenHeader: []
      summary: "Start or stop a catalogue service, or pick a capability container's\
        \ model — each runs loopback-only and the gateway points at it."
      tags:
      - runtime
      x-chatpanel-auth: token
      x-chatpanel-since: 0.19.0
  /v1/detect:
    post:
      description: |
        The standard `detect` signature over the in-process entity detector. Labels are the
        model's own (`private_person`, `PER`, `GIVENNAME`…) — the client maps them; the
        vocabulary is listed by `GET /v1/capabilities`. `budgetMs` is refused (503
        `over_budget`) from the provider's own latency record before the model runs, never
        missed. An engine that is still loading answers 503 `detector_unready`; an empty
        `entities` on 200 means the model found nothing. Raw text reaches the model here and
        nowhere else — this route is loopback-only like the rest of the gateway.
      operationId: capabilities.detect
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DetectRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectResponse"
          description: The spans found.
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "The detector is not ready (`detector_unready`, `detector_error`)\
            \ or the budget cannot be met (`over_budget`, with `predictedMs` and `budgetMs`)."
      summary: "Find entities in text — the model's own labels, with offsets and scores."
      tags:
      - capabilities
      x-chatpanel-auth: open
      x-chatpanel-since: 0.13.0
      x-chatpanel-scope: "the request text, in this process"
  /v1/rerank:
    post:
      description: |
        The Cohere / Jina rerank shape, served BY PROXY: the gateway forwards to the reranker
        it is pointed at — the `reranker` container started under Settings › Runtime (Text
        Embeddings Inference with `BAAI/bge-reranker-v2-m3`, loopback-only), or the server
        `capabilities.rerank` names — through the adapter that speaks its wire, and validates
        the answer against the contract before it leaves (a wrong shape is 502 `bad_shape`,
        never a bad order). `budgetMs` is refused (503 `over_budget`) from the gateway's own
        latency record before dialling. 404 `no_provider` until a provider is configured;
        503 `provider_unavailable` when it does not answer. `GET /v1/capabilities` lists it
        only while configured.
      operationId: capabilities.rerank
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RerankRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RerankResponse"
          description: "The documents' indexes, best first."
        "400":
          $ref: "#/components/responses/Error"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "No reranker is configured (`no_provider`), or the model asked\
            \ for is not the one served (`model_not_found`)."
        "502":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: The provider answered but not in the contract's shape (`bad_shape`)
            or with an error (`provider_error`).
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "The provider did not answer (`provider_unavailable`) or the\
            \ budget cannot be met (`over_budget`, with `predictedMs` and `budgetMs`)."
      summary: "Order documents by relevance to a query — a cross-encoder, no language\
        \ model."
      tags:
      - capabilities
      x-chatpanel-auth: open
      x-chatpanel-since: 0.20.0
      x-chatpanel-scope: "the query and the documents, to the configured reranker"
  /v1/decide:
    post:
      description: |
        ChatPanel's `decide` signature (docs/capability-endpoints.md §4.2): `state` is the text
        judged, `questions` are keyed by identifier — a `choice` picks one of its `options`, a
        `score` places the state on `options` read as an ordered rubric, a `noul` is yes/no.
        Served BY PROXY through the adapter the config names: the `opendecision` container
        started under Settings › Runtime (TypeSafe's `/v1/systemone` shape, loopback-only), or
        a server `capabilities.decide` names (a Jev endpoint with a token, another gateway).
        `calibrated` in the response says whether `p` may be read as a probability — an NLI
        concentration (OpenDecision) is not one. Errors as `/v1/rerank`.
      operationId: capabilities.decide
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecideResponse"
          description: An answer per question.
        "400":
          $ref: "#/components/responses/Error"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "No decision model is configured (`no_provider`), or the model\
            \ asked for is not the one served (`model_not_found`)."
        "502":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: The provider answered but not in the contract's shape (`bad_shape`)
            or with an error (`provider_error`).
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: The provider did not answer (`provider_unavailable`) or the
            budget cannot be met (`over_budget`).
      summary: "Typed decisions over a text — a choice, a score or a yes/no, each\
        \ with a probability."
      tags:
      - capabilities
      x-chatpanel-auth: open
      x-chatpanel-since: 0.20.0
      x-chatpanel-scope: "the state text and the questions, to the configured decision\
        \ model"
  /v1/search:
    post:
      description: |
        The `search` capability (docs/web-retrieval.md §4.1). Providers are listed by
        `GET /v1/capabilities`: `serp` (a results page fetched and read with the shared rules —
        no install, the default) and `searxng` (the user's own metasearch, preferred the moment it
        answers). `read: N` reads the top N results in parallel in this request, each carrying a
        §4.2 document under `read` — one round-trip instead of 1 + N; a page that will not be read
        keeps its snippet with `read.restricted.reason`. The query goes through layer-1 redaction
        (emails, cards, keys, dictionary terms — never the name detector) before it leaves; what
        was replaced is dropped and `redacted: true` says so; a query with nothing left is 400
        `unsafe_query`. `freshness` and `lang` are honoured by SearXNG; `site` by both. `budgetMs`
        covers the search and its reads and is refused (503 `over_budget`) from the provider's
        record. `engines` names what was actually asked, so an empty list can be told from a
        blocked one.

        Since gateway 0.78.0 `serp` asks one built-in engine per search (DuckDuckGo, Startpage,
        Bing) plus any search API the person added in the gateway's settings (Exa, Brave,
        Tavily, Serper, SerpApi, Google Programmable Search, Jina, Mwmbl, or one they describe —
        keyed ones first); an engine that refuses rests for a while. Since gateway 0.79.0 every
        result is tagged with its `engine` and `via` (the kind of door it came through), and
        `trail` says what each provider and engine asked did and, when nothing came back, why —
        `nothing` (they answered, found nothing) reads differently from `blocked`, `resting` or
        `offline`. Both are optional: an older gateway sends neither.
      operationId: retrieval.search
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebSearchRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebSearchResponse"
          description: "Ranked results — possibly none, with `engines` naming what\
            \ was asked."
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "A bad body (`invalid_request`), or a query that was only private\
            \ values (`unsafe_query`)."
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: The named provider is not available here (`provider_not_found`).
        "502":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: The provider failed (`provider_failed` — a SearXNG 403/429
            names the settings fix).
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: The budget cannot be met (`over_budget`).
        "504":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: The provider did not answer within the budget (`fetch_timeout`).
      summary: Search the web through the provider this gateway is configured with;
        optionally read the top results in the same request.
      tags:
      - retrieval
      x-chatpanel-auth: open
      x-chatpanel-since: 0.15.0
      x-chatpanel-scope: "the query (after layer-1 redaction), to the configured provider;\
        \ the top pages when `read` is set"
  /v1/search/{q}:
    get:
      description: |
        Same search as `POST /v1/search` with `read: 5` (`?read=N`, 0–10, changes it), answered
        in the shape the shipped ChatPanel extension's *Web search API* engine already reads:
        `{ code, status, data: [{ url, title, description, content, publishedTime? }] }` where
        `content` is the page's Markdown when it was read and the snippet otherwise — nothing
        needs fetching on the client. A Bearer token is accepted and ignored. Since gateway
        0.79.0 each item may carry `engine` and `via`, and the top level `trail`, exactly as
        `POST /v1/search` does (a Jina reader ignores them).
      operationId: retrieval.searchAlias
      parameters:
      - description: "The query, percent-encoded."
        explode: false
        in: path
        name: q
        required: true
        schema:
          maxLength: 1024
          type: string
        style: simple
      - explode: true
        in: query
        name: read
        required: false
        schema:
          default: 5
          maximum: 10
          minimum: 0
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/retrieval_searchAlias_200_response"
          description: The results with content.
        "400":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"
      summary: The s.jina.ai-shaped alias — `GET /v1/search/<query>` — the top results
        WITH their content.
      tags:
      - retrieval
      x-chatpanel-auth: open
      x-chatpanel-since: 0.15.0
      x-chatpanel-scope: "the query (after layer-1 redaction), to the configured provider;\
        \ the top pages"
  /v1/embeddings:
    post:
      description: |
        The `embed` capability (docs/capability-endpoints.md C4), served since 0.101.0 by the
        in-process embedder (`Xenova/multilingual-e5-small` by default, 384 dimensions, q8 on
        the ONNX runtime; `Xenova/all-MiniLM-L6-v2` as the lighter English-only pick) — or by
        the server `capabilities.embed` names, through its adapter. `input` is a string or up to
        256 strings; `kind` says whether they are queries or passages (E5 prefixes each). The
        vectors are unit length, so cosine is a dot product. 503 `provider_warming` while the
        model downloads (the first call starts it; a caller is never held), 404 `no_provider`
        when it is turned off (`capabilities.embed.provider = none`), `budgetMs` refused from
        the record like every capability. The knowledge base (`/v1/kb`) uses this for its
        vector lane; it works on words and the graph until the model is on disk.
      operationId: capabilities.embed
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmbedRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbedResponse"
          description: "One embedding per input, in order."
        "400":
          $ref: "#/components/responses/Error"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Turned off (`no_provider`), or a `model` this gateway does\
            \ not serve (`model_not_found`)."
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "The model is downloading (`provider_warming`, with `progress`),\
            \ the budget cannot be met (`over_budget`), or the provider did not answer\
            \ (`provider_unavailable`)."
      summary: "One unit vector per input — OpenAI-shaped embeddings, in the gateway's\
        \ own process by default."
      tags:
      - capabilities
      x-chatpanel-auth: open
      x-chatpanel-since: 0.101.0
      x-chatpanel-scope: "the texts, to the configured embedder — in this process\
        \ by default"
  /v1/extract/context:
    post:
      description: |
        The turn pipeline's document stage as an API. Every ChatPanel client reads a file the
        person attached BEFORE a small model answers: whole when it fits the window's share of
        characters, else the pages that carry the question's words, each page cited, as one
        `prefetch` block placed before the question (a small model reads context first). A
        harness built on this SDK gets the same block here: send the question and the documents
        (the bytes, base64, or the `hash` of one `/v1/extract` already opened), and put
        `attachment.text` in the user message ahead of the question. `window` (tokens) sizes the
        share — a 4k on-device model gets a few thousand characters, a large window far more —
        or `budgetChars` sets it outright. `how` says whether the whole document went or pages
        were picked; `read` lists each document's pages, `skipped` the ones that could not be
        opened. A document with no text layer is named as a scan inside the block rather than
        guessed from. Parsed in the same worker as `/v1/extract`, on this machine; nothing leaves it.
      operationId: retrieval.extractContext
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtractContextRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractContextResponse"
          description: "The block to put before the question, and what was read."
        "400":
          $ref: "#/components/responses/Error"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: A `hash` is not open in the worker (`unknown_document`) — send
            the bytes again.
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: A document is over the 64 MB limit (`too_large`).
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: No reader for these bytes (`unsupported`).
      summary: "The attached document(s) read FOR a question — one cited block to\
        \ put before the question, as ChatPanel's own clients do."
      tags:
      - retrieval
      x-chatpanel-auth: open
      x-chatpanel-since: 0.102.0
      x-chatpanel-scope: "the documents sent, read on this machine, never sent anywhere"
  /v1/extract:
    post:
      description: |
        The `extract` capability (docs/capability-endpoints.md): the third leg beside `search`
        and `read`. Two calls on one route. With `name` and `data` (the file, base64), the
        document is parsed in a worker process on this machine — no network, the vault
        unreadable — and the answer is its identity (`hash`, SHA-256 of the bytes), its `type`
        as read from the bytes, its `title` when it has one and how many `pages` it has; the
        text stays on the server. With `hash` and `page`, one page's text comes back; the
        bytes crossed once. A page is the format's own unit (a PDF page, a slide, a sheet) or,
        for a document with none (DOCX, Markdown, text), a run of ~6,000 characters cut at a
        heading. Readers: PDF (pdf.js, the text layer — a scanned document is `scanned: true`
        with empty pages, never OCR'd), DOCX (Markdown), XLSX/ODS (rows of cells), PPTX/ODP
        (a slide per page, speaker notes appended), ODT, Markdown, text, CSV, HTML. A hash the
        worker no longer holds (it is dropped when idle) is a 404 `unknown_document`: send the
        bytes again. `budgetMs` is refused (503 `over_budget`) from the worker's own record.
      operationId: retrieval.extract
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtractRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractResponse"
          description: "The document opened (hash, type, pages) — or, with `page`,\
            \ that page's text."
        "400":
          $ref: "#/components/responses/Error"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: The hash is not open in the worker (`unknown_document`) — send
            the bytes again.
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: The document is over the 64 MB limit (`too_large`).
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: No reader for these bytes (`unsupported`).
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "The budget cannot be met (`over_budget`, with `predictedMs`)."
        "504":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: The parse took too long and the worker was restarted (`extract_timeout`).
      summary: "A document's pages from its bytes — a PDF, a Word file, a sheet, a\
        \ deck — parsed once, paged by hash."
      tags:
      - retrieval
      x-chatpanel-auth: open
      x-chatpanel-since: 0.16.0
      x-chatpanel-scope: "one document, parsed on this machine, never sent anywhere"
