openapi: 3.1.0
info:
  contact:
    name: ChatPanel
    url: https://chatpanel.net
  description: |
    The ChatPanel gateway runs on the user's machine (loopback only, port 4320 by default). It
    redacts personal data before a model sees it, routes model traffic, and holds the user's
    searchable history, durable memory, shared preferences and the team/project run boards.

    **It only answers on loopback.** A client on another host cannot reach it; an SDK refuses a
    non-loopback base URL unless the integrator opts in and uses TLS.

    **Two trust levels.** The `/v1` data plane is open to any local process — that is the
    product. Writes that change what every client sees (remember, forget, ingest) and anything
    admin-shaped require the per-install token the gateway writes to
    `~/.chatpanel/gateway-token` (mode 0600), or a copy obtained by pairing (`POST /pair` with
    a one-time code from `chatpanel-gateway pair`). `POST /whoami` says which trust you have.

    **Errors** are `{ error: { message, type } }` (or `{ error: "text" }` on the oldest routes)
    with the HTTP status. `type` is a stable machine word: `not_found`, `invalid_request`,
    `unknown_endpoint`, `unavailable`, `bridge_unreachable`, `no_bridge`, `redact_error`,
    `search_error`, `memory_error`, `team_error`, `ingest_error`, `prefs_error`.
  license:
    name: Apache-2.0
  title: ChatPanel Gateway API
  version: 0.35.0
servers:
- description: The local gateway. Loopback only.
  url: http://127.0.0.1:4320
security:
- {}
- gatewayToken: []
tags:
- description: "Liveness, identity and pairing."
  name: gateway
- description: What the gateway can route to.
  name: models
- description: "Several models as one — union, draft + target, fallback."
  name: fusions
- description: "Speech in and out, OpenAI-shaped, over the gateway's own engines or\
    \ its table's provider."
  name: audio
- description: "The OpenAI-compatible chat endpoint, redacted and routed by the gateway."
  name: chat
- description: Preview what the model would receive.
  name: redaction
- description: "The user's searchable history — chats, notes, meetings, briefs."
  name: history
- description: "Durable facts about the user, carried into every turn on every client."
  name: memory
- description: The settings every client shares.
  name: prefs
- description: Team runs — the board every client can read.
  name: teams
- description: The project record — the page a goal starts on and everything done
    for it.
  name: projects
- description: Attested per-agent scorecards.
  name: agents
- description: The model ledger — every engine's card.
  name: engines
- description: "The small non-generative models this gateway provides — discovery,\
    \ and one standard signature per capability (docs/capability-endpoints.md)."
  name: capabilities
- description: The skills on this machine (served through the bridge).
  name: skills
- description: "Web retrieval — search through the provider the user chose, and a\
    \ page as LLM-ready Markdown, cited where it landed, with its sections (docs/web-retrieval.md)."
  name: retrieval
- description: "What runs processes for the user and how — the process sandbox (through\
    \ the bridge), the container engine on this machine, and the services the gateway\
    \ runs for the user (docs/sandboxing.md S1)."
  name: runtime
- description: "The durable event log, merged across every client and served as one\
    \ CloudEvents 1.0 stream — metadata only (refs and counts, never content), ordered\
    \ by `(host, seq)` and `causes`, never by clock (docs/event-stream-sync.md E1)."
  name: events
paths:
  /health:
    get:
      description: Additive fields only. `version` is what every version gate reads.
      operationId: gateway.health
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
          description: The gateway is up.
      summary: "Liveness, version and capabilities."
      tags:
      - gateway
      x-chatpanel-auth: open
      x-accepts:
      - application/json
  /whoami:
    post:
      operationId: gateway.whoami
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhoAmI"
          description: The caller's trust class.
      summary: What the gateway makes of this caller.
      tags:
      - gateway
      x-chatpanel-auth: open
      x-chatpanel-since: 0.9.0
      x-accepts:
      - application/json
  /pair/code:
    post:
      description: Only a caller that already holds the token may mint one — pairing
        widens nothing.
      operationId: gateway.pairCode
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingCode"
          description: The code to carry into the client.
        "403":
          $ref: "#/components/responses/Forbidden"
      security:
      - gatewayToken: []
      - tokenHeader: []
      summary: "Mint a one-time pairing code (5 minutes, one use, 5 attempts)."
      tags:
      - gateway
      x-chatpanel-auth: token
      x-chatpanel-since: 0.9.0
      x-accepts:
      - application/json
  /pair:
    post:
      operationId: gateway.pair
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/gateway_pair_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Paired"
          description: Paired. Store the token where only this user can read it.
        "403":
          $ref: "#/components/responses/Forbidden"
      summary: Exchange a pairing code for the gateway token.
      tags:
      - gateway
      x-chatpanel-auth: open
      x-chatpanel-since: 0.9.0
      x-content-type: application/json
      x-accepts:
      - application/json
  /audit:
    get:
      description: The checkable claim behind "nothing leaves the machine". Admin-gated
        because it names the user's model endpoints.
      operationId: gateway.audit
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Audit"
          description: The audit.
        "403":
          $ref: "#/components/responses/Forbidden"
      security:
      - gatewayToken: []
      - tokenHeader: []
      summary: The egress audit — which hosts this gateway has contacted and which
        its config allows.
      tags:
      - gateway
      x-chatpanel-auth: token
      x-accepts:
      - application/json
  /v1/models:
    get:
      description: |
        Describes the routing table, not the disk: a bridge agent is listed whether or not the
        CLI is installed. From 0.6.64 each agent carries `available`; from 0.6.66 a cloud model
        carries `configured: false` when a turn is known to fail for something the user can fix.
      operationId: models.list
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelList"
          description: The list.
      summary: Every model the gateway can route to.
      tags:
      - models
      x-chatpanel-auth: open
      x-accepts:
      - application/json
  /v1/chat/completions:
    post:
      description: |
        Redacted on the way out, restored on the way back, routed by `model`. With `stream: true`
        the response is `text/event-stream` of OpenAI chunk objects ending in `data: [DONE]`.
        Send `tools` so a redacted turn can still act: the gateway relays a tool call back with
        real arguments and redacts the result. `X-ChatPanel-Redaction: off` is honoured only from
        a token-bearing caller (0.6.69+) and is recorded in the trace.

        **Permission prompts (gateway 0.25.0+).** List a function tool named `permission_prompt`
        to say your client can answer an agent's "may I run this?" — the gateway strips it from
        what the agent sees and lets the agent ask instead of denying headlessly. The question
        arrives as a `tool_calls` stop on that tool, its arguments `{ tool, input, description,
        path, rules }`; answer with a `tool` message whose content is the JSON
        `{ "behavior": "allow" | "deny", "scope": "once" | "chat", "message"?: string }`.
        Anything else is a deny.

        **Two lanes.** An API destination (a cloud or local model endpoint) is a proxy hop and is
        open to any local caller. An AGENT destination (`codex`, `claude`, `opencode`, … —
        `provider_type: agent` in `GET /v1/models`) spawns a process on this machine, so the
        caller must hold the gateway token (0.9.0+): without it the gateway answers **401**
        `{ type: 'auth', code: 'agent_lane_token_required' }`. The SDKs surface that as
        `ForbiddenError` with `status` 401.
      operationId: chat.completions
      parameters:
      - $ref: "#/components/parameters/RedactionHeader"
      - $ref: "#/components/parameters/RunHeader"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletion"
            text/event-stream:
              schema:
                description: "`data: {chunk}` frames; `data: [DONE]` ends it."
                type: string
              x-chatpanel-frame:
                $ref: "#/components/schemas/ChatCompletionChunk"
          description: "The completion, or a stream of chunks."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: An agent destination was asked for by a caller without the
            gateway token.
        "4XX":
          $ref: "#/components/responses/Error"
        "5XX":
          $ref: "#/components/responses/Error"
      summary: One chat turn through the gateway (OpenAI-compatible).
      tags:
      - chat
      x-chatpanel-auth: open
      x-chatpanel-stream: sse-when-stream
      x-content-type: application/json
      x-accepts:
      - application/json
      - text/event-stream
  /redact:
    post:
      description: "Runs the same redaction path as a real turn. The reply carries\
        \ placeholder types, never the real values."
      operationId: redaction.preview
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/redaction_preview_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedactionPreview"
          description: The redacted text and what was replaced.
        "500":
          $ref: "#/components/responses/Error"
      summary: What the model would receive if this text were sent now.
      tags:
      - redaction
      x-chatpanel-auth: open
      x-chatpanel-since: 0.6.62
      x-content-type: application/json
      x-accepts:
      - application/json
  /v1/history/search:
    post:
      operationId: history.search
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
          description: Ranked snippets.
        "400":
          $ref: "#/components/responses/Error"
      summary: One keyword query over the warm index.
      tags:
      - history
      x-chatpanel-auth: open
      x-content-type: application/json
      x-accepts:
      - application/json
  /v1/history/smart-search:
    post:
      operationId: history.smartSearch
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SmartSearchRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmartSearchResponse"
          description: Fused results and the queries that were run.
        "400":
          $ref: "#/components/responses/Error"
      summary: "Several phrasings at once, rank-fused; briefs lead."
      tags:
      - history
      x-chatpanel-auth: open
      x-content-type: application/json
      x-accepts:
      - application/json
  /v1/history/related:
    get:
      operationId: history.related
      parameters:
      - explode: true
        in: query
        name: id
        required: true
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 5
          maximum: 30
          minimum: 1
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/history_related_200_response"
          description: Neighbours.
      summary: The records most connected to one record.
      tags:
      - history
      x-chatpanel-auth: open
      x-accepts:
      - application/json
  /v1/history/status:
    get:
      operationId: history.status
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryStatus"
          description: Status.
      summary: Size and freshness of the warm index (and the lossless tier from 0.10.0).
      tags:
      - history
      x-chatpanel-auth: open
      x-accepts:
      - application/json
  /v1/history/list:
    get:
      operationId: history.list
      parameters:
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 500
          minimum: 1
          type: integer
        style: form
      - explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
        style: form
      - explode: true
        in: query
        name: type
        required: false
        schema:
          $ref: "#/components/schemas/RecordType"
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryPage"
          description: The page.
      summary: "A page of the warm index — metadata only, no bodies."
      tags:
      - history
      x-chatpanel-auth: open
      x-accepts:
      - application/json
  /v1/history/get:
    get:
      operationId: history.get
      parameters:
      - explode: true
        in: query
        name: id
        required: true
        schema:
          type: string
        style: form
      - description: Page a long transcript instead of pulling it all.
        explode: true
        in: query
        name: maxChars
        required: false
        schema:
          minimum: 1
          type: integer
        style: form
      - explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/history_get_200_response"
          description: The record.
        "404":
          $ref: "#/components/responses/Error"
      summary: "One full warm record, optionally paged by characters."
      tags:
      - history
      x-chatpanel-auth: open
      x-accepts:
      - application/json
  /v1/history/records:
    get:
      description: The lossless tier. A gateway without the SQLite store answers 501.
      operationId: history.records
      parameters:
      - description: A stamp (ms since epoch) from a previous page's `newest`.
        explode: true
        in: query
        name: since
        required: false
        schema:
          default: 0
          format: int64
          minimum: 0
          type: integer
        style: form
      - description: Opaque; from the previous page.
        explode: true
        in: query
        name: cursor
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 200
          minimum: 1
          type: integer
        style: form
      - explode: true
        in: query
        name: kind
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordsPage"
          description: A page of whole records.
        "501":
          $ref: "#/components/responses/Error"
      summary: "WHOLE records changed after a stamp, oldest first, paged by cursor,\
        \ tombstones included."
      tags:
      - history
      x-chatpanel-auth: open
      x-chatpanel-since: 0.10.0
      x-accepts:
      - application/json
    put:
      operationId: history.putRecords
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutRecordsRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PutRecordsResponse"
          description: What was written.
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          $ref: "#/components/responses/Error"
      security:
      - gatewayToken: []
      - tokenHeader: []
      summary: Push whole records; the gateway derives the searchable text itself.
      tags:
      - history
      x-chatpanel-auth: token
      x-chatpanel-since: 0.10.0
      x-content-type: application/json
      x-accepts:
      - application/json
  /v1/history/stream:
    get:
      operationId: history.stream
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                type: string
              x-chatpanel-frame:
                $ref: "#/components/schemas/HistoryStreamEvent"
          description: "`event: hello` `{ newest, size, version }`, then `event: records`\
            \ `{ newest, size, ids, at }`; a comment ping every 25 s."
        "501":
          $ref: "#/components/responses/Error"
      summary: "Live record changes — `hello` once, then a `records` event per change."
      tags:
      - history
      x-chatpanel-auth: open
      x-chatpanel-since: 0.11.0
      x-chatpanel-stream: sse
      x-accepts:
      - application/json
      - text/event-stream
  /v1/events:
    get:
      operationId: events.since
      parameters:
      - description: "JSON `{ host: seq }` — the highest seq per host you already\
          \ hold. Absent means everything."
        explode: true
        in: query
        name: cursor
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 1000
          maximum: 1000
          minimum: 1
          type: integer
        style: form
      - description: One host's slice only.
        explode: true
        in: query
        name: host
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventsPage"
          description: A page; re-ask with the returned `cursor` while `more` is true.
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          $ref: "#/components/responses/Error"
      security:
      - gatewayToken: []
      - tokenHeader: []
      summary: "The merged log above a cursor — host by host in `seq` order, as CloudEvents,\
        \ paged."
      tags:
      - events
      x-chatpanel-auth: token
      x-chatpanel-since: 0.24.0
      x-accepts:
      - application/json
    post:
      description: "Idempotent on event id, so a retry is free. A `seq` that moves\
        \ backwards for a host under a new id is a corrupt writer and is refused by\
        \ itself; the rest of the batch lands. Push what lies above your entry in\
        \ `cursor` (the gateway's highest `seq` per host) and stop re-sending what\
        \ `rejected` names. At most 2000 events per batch. A gateway without SQLite\
        \ answers 501."
      operationId: events.push
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushEventsRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushEventsResponse"
          description: "What the batch did, and the cursor afterwards."
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/Error"
        "501":
          $ref: "#/components/responses/Error"
      security:
      - gatewayToken: []
      - tokenHeader: []
      summary: "Push a batch of this client's durable log as CloudEvents; each event\
        \ is appended once, each refusal is named."
      tags:
      - events
      x-chatpanel-auth: token
      x-chatpanel-since: 0.24.0
      x-content-type: application/json
      x-accepts:
      - application/json
  /v1/events/cursor:
    get:
      operationId: events.cursor
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventsCursor"
          description: The cursor and the log's size.
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          $ref: "#/components/responses/Error"
      security:
      - gatewayToken: []
      - tokenHeader: []
      summary: The gateway's highest `seq` per host — what a client asks for before
        it pushes.
      tags:
      - events
      x-chatpanel-auth: token
      x-chatpanel-since: 0.24.0
      x-accepts:
      - application/json
  /v1/events/stats:
    get:
      operationId: events.stats
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventsStats"
          description: "The numbers, over the retained log (at most the last 25 000\
            \ events)."
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          $ref: "#/components/responses/Error"
      security:
      - gatewayToken: []
      - tokenHeader: []
      summary: "What the merged log measures — bytes and events per turn, per surface,\
        \ per host and per day; the dedup hit-rate; tool calls; a year projected against\
        \ the cap."
      tags:
      - events
      x-chatpanel-auth: token
      x-chatpanel-since: 0.25.1
      x-accepts:
      - application/json
  /v1/events/stream:
    get:
      operationId: events.stream
      parameters:
      - description: "JSON `{ host: seq }`; when present the events above it are replayed\
          \ before live frames."
        explode: true
        in: query
        name: cursor
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                type: string
              x-chatpanel-frame:
                $ref: "#/components/schemas/EventsStreamEvent"
          description: "`event: hello` `{ cursor, count, version }`, then `event:\
            \ cloudevent` with one CloudEvents 1.0 JSON object as data; a comment\
            \ ping every 25 s. A reader appends by id, so a duplicate on the wire\
            \ is harmless."
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          $ref: "#/components/responses/Error"
      security:
      - gatewayToken: []
      - tokenHeader: []
      summary: "Tail the merged log — `hello` once, then a `cloudevent` frame per\
        \ appended event; with `cursor`, the backlog above it first."
      tags:
      - events
      x-chatpanel-auth: token
      x-chatpanel-since: 0.24.0
      x-chatpanel-stream: sse
      x-accepts:
      - application/json
      - text/event-stream
  /v1/history/ingest:
    post:
      operationId: history.ingest
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/history_ingest_200_response"
          description: The index size after the write.
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
      security:
      - gatewayToken: []
      - tokenHeader: []
      summary: Push flattened (lossy) records into the warm index.
      tags:
      - history
      x-chatpanel-auth: token
      x-content-type: application/json
      x-accepts:
      - application/json
  /v1/memory/list:
    get:
      operationId: memory.list
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryList"
          description: The list.
      summary: Every memory.
      tags:
      - memory
      x-chatpanel-auth: open
      x-accepts:
      - application/json
  /v1/memory/recall:
    post:
      operationId: memory.recall
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecallRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecallResponse"
          description: Relevant memories.
        "400":
          $ref: "#/components/responses/Error"
      summary: "The memories relevant to a text, and a prompt block that carries them."
