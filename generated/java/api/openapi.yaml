            names the settings fix).
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: The budget cannot be met (`over_budget`).
        "504":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: The provider did not answer within the budget (`fetch_timeout`).
      summary: Search the web through the provider this gateway is configured with;
        optionally read the top results in the same request.
      tags:
      - retrieval
      x-chatpanel-auth: open
      x-chatpanel-since: 0.15.0
      x-chatpanel-scope: "the query (after layer-1 redaction), to the configured provider;\
