      tags:
      - audio
      x-chatpanel-since: 0.34.0
      x-chatpanel-auth: open
      x-chatpanel-sdk: manual
      x-chatpanel-scope: the audio leaves the machine only when the table's STT provider
        is remote
      x-content-type: multipart/form-data
      x-accepts:
      - application/json
      - text/plain
