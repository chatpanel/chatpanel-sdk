      x-accepts:
      - application/json
  /v1/extract:
    post:
      description: |
        The `extract` capability (docs/capability-endpoints.md): the third leg beside `search`
        and `read`. Two calls on one route. With `name` and `data` (the file, base64), the
        document is parsed in a worker process on this machine — no network, the vault
        unreadable — and the answer is its identity (`hash`, SHA-256 of the bytes), its `type`
        as read from the bytes, its `title` when it has one and how many `pages` it has; the
        text stays on the server. With `hash` and `page`, one page's text comes back; the
        bytes crossed once. A page is the format's own unit (a PDF page, a slide, a sheet) or,
        for a document with none (DOCX, Markdown, text), a run of ~6,000 characters cut at a
        heading. Readers: PDF (pdf.js, the text layer — a scanned document is `scanned: true`
        with empty pages, never OCR'd), DOCX (Markdown), XLSX/ODS (rows of cells), PPTX/ODP
        (a slide per page, speaker notes appended), ODT, Markdown, text, CSV, HTML. A hash the
        worker no longer holds (it is dropped when idle) is a 404 `unknown_document`: send the
        bytes again. `budgetMs` is refused (503 `over_budget`) from the worker's own record.
      operationId: retrieval.extract
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtractRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractResponse"
          description: "The document opened (hash, type, pages) — or, with `page`,\
            \ that page's text."
        "400":
          $ref: "#/components/responses/Error"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: The hash is not open in the worker (`unknown_document`) — send
            the bytes again.
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: The document is over the 64 MB limit (`too_large`).
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: No reader for these bytes (`unsupported`).
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "The budget cannot be met (`over_budget`, with `predictedMs`)."
        "504":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: The parse took too long and the worker was restarted (`extract_timeout`).
      summary: "A document's pages from its bytes — a PDF, a Word file, a sheet, a\
        \ deck — parsed once, paged by hash."
      tags:
      - retrieval
      x-chatpanel-auth: open
      x-chatpanel-since: 0.16.0
      x-chatpanel-scope: "one document, parsed on this machine, never sent anywhere"
      x-content-type: application/json
      x-accepts:
      - application/json
  /v1/read:
    post:
      description: |
        The `read` capability (docs/web-retrieval.md §4.2). The page is fetched from this
        machine as the user's agent — public web only (the shared SSRF guard, re-checked
        where a redirect lands), a browser User-Agent, no cookies — and turned into Markdown
        that keeps headings, lists, tables, code and links. `url` in the answer is where the
        page should be CITED: the same-origin canonical when it declares one, else where the
        fetch landed; `sections` are the page's own heading ids with their offset into the
        content so a citation can point at `url#section`. A page that could not be read as
        the article — a login wall, a paywall, a 429 — is a 200 with `restricted.reason` and
        the caller's `snippet` standing in for the content, never the wall rendered as prose.
        `maxChars` cuts at a section boundary. A read is served from this process's page
        cache when fresh (`cached: true`), revalidated with its ETag when stale. `budgetMs`
        is refused (503 `over_budget`) from the provider's own record, never missed. Providers
        are listed by `GET /v1/capabilities`: `defuddle` (in-process), `text` (the DOM-less
        fallback), `remote` (an `r.jina.ai`-shaped reader configured under `read.remote`).
      operationId: retrieval.read
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReadRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadResponse"
          description: "The page — or, with `restricted` set, the reason it was not\
            \ read and the snippet in its place."
        "400":
          $ref: "#/components/responses/Error"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: The named provider is not available here (`provider_not_found`).
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: The page is not HTML or text (`unsupported_content`).
        "502":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "The page could not be fetched (`fetch_failed`), or its host\
            \ — or where it redirected — is not public web (`blocked_host`)."
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "The budget cannot be met (`over_budget`, with `predictedMs`\
            \ and `budgetMs`)."
        "504":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: The page did not answer within the budget (`fetch_timeout`).
      summary: "Read one public page as LLM-ready Markdown, cited where it landed,\
        \ with its sections."
      tags:
      - retrieval
      x-chatpanel-auth: open
      x-chatpanel-since: 0.14.0
      x-chatpanel-scope: "one public page, fetched on request"
      x-content-type: application/json
      x-accepts:
      - application/json
