            \ was asked."
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "A bad body (`invalid_request`), or a query that was only private\
            \ values (`unsafe_query`)."
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
