      responses:
        '200':
          description: The card.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnyObject' }
  /v1/engines/{engineKey}/entries:
    parameters:
      - { name: engineKey, in: path, required: true, schema: { type: string, maxLength: 300 } }
