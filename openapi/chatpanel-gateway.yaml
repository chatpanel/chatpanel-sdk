      operationId: engines.appendEntry
      tags: [engines]
      summary: Append a ledger entry for an engine.
      x-chatpanel-auth: open
      x-chatpanel-since: '0.6.89'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnyObject' }
      responses:
        '200':
          description: The entry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnyObject' }
        '400': { $ref: '#/components/responses/Error' }

  # ------------------------------------------------------------------ skills
  /skills:
    get:
      operationId: skills.list
      tags: [skills]
      summary: The skills on this machine — with a prompt character count, not the prompt.
      x-chatpanel-auth: open
      x-chatpanel-since: '0.6.64'
      parameters:
        - { name: workdir, in: query, schema: { type: string }, description: "Include the project-local skill roots of this directory (0.9.4+)." }
      responses:
        '200':
          description: Skills.
          content:
            application/json:
              schema:
                type: object
                required: [skills]
                properties:
                  skills: { type: array, items: { $ref: '#/components/schemas/Skill' } }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /skills/{skillId}:
    parameters:
      - { name: skillId, in: path, required: true, schema: { type: string, maxLength: 200, pattern: '^[^/\\]+$' }, description: "One path segment; slashes and `..` are refused." }
    get:
      operationId: skills.get
      tags: [skills]
      summary: One skill, with its prompt.
      x-chatpanel-auth: open
      x-chatpanel-since: '0.6.67'
      parameters:
        - { name: workdir, in: query, schema: { type: string } }
      responses:
        '200':
          description: The skill.
          content:
            application/json:
              schema:
                type: object
                required: [skill]
                properties:
                  skill:
                    oneOf:
                      - $ref: '#/components/schemas/Skill'
                      - type: 'null'
        '400': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    gatewayToken:
      type: http
      scheme: bearer
      description: The per-install token at `~/.chatpanel/gateway-token` (0600), or the copy a paired client received.
    tokenHeader:
      type: apiKey
      in: header
      name: X-ChatPanel-Token
      description: The same token, for a client that cannot set Authorization.

  parameters:
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string, pattern: '^[a-zA-Z0-9_-]{4,64}$' }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, pattern: '^[a-zA-Z0-9_-]{1,64}$' }
    JobId:
      name: jobId
      in: path
      required: true
      schema: { type: string, pattern: '^[a-zA-Z0-9_-]{1,64}$' }
    RedactionHeader:
      name: X-ChatPanel-Redaction
      in: header
      required: false
      schema: { type: string, enum: [off] }
      description: Turn redaction off for this turn — honoured only from a token-bearing caller (0.6.69+), recorded in the trace.
    RunHeader:
      name: X-ChatPanel-Run
      in: header
      required: false
      schema: { type: string }
      description: A team role's run context (URL-encoded JSON) for the bridge (0.6.89+). Never a token.

  responses:
    Error:
      description: An error, in the gateway's words.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: The caller lacks the token this route needs.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Removed:
      description: Whether the record existed.
      content:
        application/json:
          schema:
            type: object
            required: [ok, removed]
            properties:
              ok: { type: boolean }
              removed: { type: boolean }
    TeamRunResult:
      description: The run as it now stands.
      content:
        application/json:
          schema:
            type: object
            required: [ok, run]
            properties:
              ok: { type: boolean }
              run: { $ref: '#/components/schemas/TeamRun' }
    ProjectResult:
      description: The project as it now stands.
      content:
        application/json:
          schema:
            type: object
            required: [ok, project]
            properties:
              ok: { type: boolean }
              project: { $ref: '#/components/schemas/Project' }

  schemas:
    AnyObject:
      type: object
      additionalProperties: true
      description: A domain object whose shape is owned by `@chatpanel/events`; the SDK carries it as-is.

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          oneOf:
            - type: string
            - type: object
              required: [message]
              properties:
                message: { type: string }
                type: { type: string, description: "A stable machine word — `not_found`, `invalid_request`, `unavailable`, …" }

    Health:
      type: object
      required: [ok, version]
      additionalProperties: true
      properties:
        ok: { type: boolean }
        version: { type: string, description: "The gateway's semver; every version gate reads this." }
        backend: { type: string }
        tier: { type: string, enum: [basic, full], description: "Redaction tier." }
        pairing: { type: boolean, description: "Present from 0.9.0 — this gateway can pair a client." }
        managed: { $ref: '#/components/schemas/AnyObject' }
        managedBy: { type: string }
        bridge: { $ref: '#/components/schemas/AnyObject' }
        stt: { $ref: '#/components/schemas/AnyObject' }
        tts: { $ref: '#/components/schemas/AnyObject' }

    WhoAmI:
      type: object
      required: [ok, trust, paired, version]
      properties:
        ok: { type: boolean }
        trust: { type: string, enum: [token, pinned, unpaired, local, web] }
        paired: { type: boolean, description: "True when this caller may reach token-gated routes." }
        version: { type: string }

    PairingCode:
      type: object
      required: [ok, code, expiresAt]
      properties:
        ok: { type: boolean }
        code: { type: string }
        display: { type: string }
        expiresAt: { type: integer, format: int64, description: "ms since epoch" }

    Paired:
      type: object
      required: [ok, token]
      properties:
        ok: { type: boolean }
        token: { type: string, description: "The gateway token. A secret — store it 0600 or in the platform keychain; never log it." }
        bridgeToken: { type: string, description: "The bridge's token when this machine has one." }

    Audit:
      type: object
      additionalProperties: true
      properties:
        version: { type: string }
        startedAt: { type: integer, format: int64 }

    Model:
      type: object
      required: [id, object]
      additionalProperties: true
      properties:
        id: { type: string }
        object: { type: string, enum: [model] }
        owned_by: { type: string }
        provider: { type: string }
        provider_type: { type: string, enum: [agent, openai, anthropic], description: "0.6.64+" }
        api: { type: string }
        endpoints: { type: array, items: { type: string } }
        available: { type: boolean, description: "0.6.64+ for bridge agents — whether the CLI is installed." }
        configured: { type: boolean, description: "0.6.66+ — false when a turn is known to fail for something the user can fix." }
        reason: { type: string }
        tools: { type: boolean, description: "False when the agent cannot take per-turn tools." }
    ModelList:
      type: object
      required: [object, data]
      properties:
        object: { type: string, enum: [list] }
        data: { type: array, items: { $ref: '#/components/schemas/Model' } }

    ChatMessage:
      type: object
      required: [role]
      additionalProperties: true
      properties:
        role: { type: string, enum: [system, user, assistant, tool] }
        content:
          oneOf:
            - type: string
            - type: array
              items: { $ref: '#/components/schemas/ChatContentPart' }
            - type: 'null'
        name: { type: string }
        tool_calls: { type: array, items: { $ref: '#/components/schemas/AnyObject' } }
        tool_call_id: { type: string }
    ChatContentPart:
      type: object
      required: [type]
      additionalProperties: true
      description: One part of a multi-part message — `text`, `image_url`, … in the OpenAI shape.
      properties:
        type: { type: string }
        text: { type: string }
        image_url: { $ref: '#/components/schemas/AnyObject' }
    ChatCompletionRequest:
      type: object
      required: [model, messages]
      additionalProperties: true
      properties:
        model: { type: string, description: 'A model id from `GET /v1/models`; `claude/opus` names an agent and its model.' }
        messages: { type: array, items: { $ref: '#/components/schemas/ChatMessage' } }
        stream: { type: boolean }
        stream_options: { $ref: '#/components/schemas/AnyObject' }
        tools: { type: array, items: { $ref: '#/components/schemas/AnyObject' } }
        tool_choice: {}
        temperature: { type: number }
        max_tokens: { type: integer }
    ChatCompletion:
      type: object
      required: [id, object, choices]
      additionalProperties: true
      properties:
        id: { type: string }
        object: { type: string }
        created: { type: integer }
        model: { type: string }
        choices:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              index: { type: integer }
              message: { $ref: '#/components/schemas/ChatMessage' }
              finish_reason: { type: [string, 'null'] }
        usage: { $ref: '#/components/schemas/AnyObject' }
    ChatCompletionChunk:
      type: object
      required: [id, object, choices]
      additionalProperties: true
      description: One `data:` frame of a streamed completion.
      properties:
        id: { type: string }
        object: { type: string }
        model: { type: string }
        choices:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              index: { type: integer }
              delta: { $ref: '#/components/schemas/AnyObject' }
              finish_reason: { type: [string, 'null'] }
        usage: { $ref: '#/components/schemas/AnyObject' }

    RedactionPreview:
      type: object
      required: [text, count]
      properties:
        text: { type: string, description: "What the model would receive." }
        count: { type: integer }
        sanitized: { type: integer }
        tier: { type: string, enum: [basic, full] }
        entities: { type: array, items: { $ref: '#/components/schemas/AnyObject' }, description: "Placeholder tokens and their types — never the real values." }
        detector: { $ref: '#/components/schemas/AnyObject' }

    RecordType:
      type: string
      enum: [chat, note, meeting, brief]
    SearchFilters:
      type: object
      properties:
        type: { $ref: '#/components/schemas/RecordType' }
        since: { type: integer, format: int64, description: "ms since epoch" }
        before: { type: integer, format: int64, description: "ms since epoch" }
        limit: { type: integer, minimum: 1, maximum: 50, default: 10 }
    SearchRequest:
      allOf:
        - $ref: '#/components/schemas/SearchFilters'
        - type: object
          required: [query]
          properties:
            query: { type: string }
            offset: { type: integer, minimum: 0, default: 0 }
    SmartSearchRequest:
      allOf:
        - $ref: '#/components/schemas/SearchFilters'
        - type: object
          required: [question]
          properties:
            question: { type: string, description: "The natural-language question." }
            queries: { type: array, items: { type: string }, description: "2–4 keyword phrasings of your own; they lead." }
            maxQueries: { type: integer, minimum: 1, maximum: 6, default: 4 }
    SearchHit:
      type: object
      required: [id]
      additionalProperties: true
      properties:
        id: { type: string }
        score: { type: number }
        title: { type: string }
        type: { $ref: '#/components/schemas/RecordType' }
        date: { type: integer, format: int64 }
        snippet: { type: string }
    SearchResponse:
      type: object
      required: [ok, results]
      properties:
        ok: { type: boolean }
        size: { type: integer }
        newest: { type: integer, format: int64 }
        results: { type: array, items: { $ref: '#/components/schemas/SearchHit' } }
    SmartSearchResponse:
      allOf:
        - $ref: '#/components/schemas/SearchResponse'
        - type: object
          properties:
            queries: { type: array, items: { type: string } }
    HistoryStatus:
      type: object
      required: [ok, size]
      properties:
        ok: { type: boolean }
        size: { type: integer }
        newest: { type: integer, format: int64 }
        bytes: { type: integer, format: int64 }
        lossless:
          oneOf:
            - type: object
              properties:
                records: { type: integer }
                newest: { type: integer, format: int64 }
            - type: 'null'
    HistoryItem:
      type: object
      required: [id]
      additionalProperties: true
      properties:
        id: { type: string }
        title: { type: string }
        type: { $ref: '#/components/schemas/RecordType' }
        date: { type: integer, format: int64 }
        chars: { type: integer }
    HistoryPage:
      type: object
      required: [ok, total, items]
      properties:
        ok: { type: boolean }
        total: { type: integer }
        items: { type: array, items: { $ref: '#/components/schemas/HistoryItem' } }
    HistoryRecord:
      type: object
      required: [id, text]
      additionalProperties: true
      properties:
        id: { type: string }
        title: { type: string }
        type: { $ref: '#/components/schemas/RecordType' }
        date: { type: integer, format: int64 }
        text: { type: string }
    RecordsPage:
      type: object
      required: [ok, records]
      additionalProperties: true
      properties:
        ok: { type: boolean }
        records: { type: array, items: { $ref: '#/components/schemas/AnyObject' }, description: "Whole records; a tombstone carries `deletedAt`." }
        next: { type: string, description: "The cursor for the next page — pass it as `cursor`; absent on the last page." }
        size: { type: integer }
        newest: { type: integer, format: int64 }
    PutRecordsRequest:
      type: object
      properties:
        host: { type: string, maxLength: 80, description: "Who is pushing — recorded on every record." }
        at: { type: integer, format: int64 }
        records: { type: array, items: { $ref: '#/components/schemas/AnyObject' } }
        entries: { type: array, items: { $ref: '#/components/schemas/AnyObject' }, description: "Sealed backup entries, opened with the stored passphrase." }
    PutRecordsResponse:
      type: object
      required: [ok, written]
      properties:
        ok: { type: boolean }
        written: { type: integer }
        ids: { type: array, items: { type: string } }
        sealed: { type: integer }
        size: { type: integer }
    IngestRequest:
      type: object
      properties:
        upserts:
          type: array
          items:
            type: object
            required: [id, text]
            additionalProperties: true
            properties:
              id: { type: string }
              title: { type: string }
              type: { $ref: '#/components/schemas/RecordType' }
              date: { type: integer, format: int64 }
              text: { type: string }
        removes: { type: array, items: { type: string } }

    Memory:
      type: object
      required: [id, text]
      additionalProperties: true
      properties:
        id: { type: string }
        text: { type: string }
        kind: { type: string }
        scope: { type: string }
        tags: { type: array, items: { type: string } }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
        source: { $ref: '#/components/schemas/MemorySource' }
    MemorySource:
      type: object
      description: Who proposed the memory. There is no confirm dialog on a CLI, so attribution is the accountability.
      properties:
        via: { type: string, description: "The client — e.g. `sdk`, `cli`, `mcp`." }
        surface: { type: string }
        agent: { type: string }
        ref: { type: string }
    MemoryList:
      type: object
      required: [ok, memories]
      properties:
        ok: { type: boolean }
        size: { type: integer }
        memories: { type: array, items: { $ref: '#/components/schemas/Memory' } }
    RecallRequest:
      type: object
      required: [text]
      properties:
        text: { type: string }
        scopes: { type: array, items: { type: string }, default: [global] }
        limit: { type: integer }
        maxChars: { type: integer }
    RecallResponse:
      type: object
      required: [ok, memories]
      additionalProperties: true
      properties:
        ok: { type: boolean }
        size: { type: integer }
        memories: { type: array, items: { $ref: '#/components/schemas/Memory' } }
        block: { type: string, description: "A prompt block carrying the recalled memories." }
    RememberRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, description: "One short sentence." }
        kind: { type: string, default: fact }
        scope: { type: string, default: global }
        tags: { type: array, items: { type: string } }
        source: { $ref: '#/components/schemas/MemorySource' }
    RememberResponse:
      type: object
      required: [ok, action, record]
      properties:
        ok: { type: boolean }
        action: { type: string }
        record: { $ref: '#/components/schemas/Memory' }
        replaced:
          oneOf:
            - $ref: '#/components/schemas/Memory'
            - type: 'null'
        size: { type: integer }
    MemorySyncResponse:
      type: object
      required: [ok, memories]
      additionalProperties: true
      properties:
        ok: { type: boolean }
        size: { type: integer }
        memories: { type: array, items: { $ref: '#/components/schemas/Memory' } }

    HistoryStreamEvent:
      type: object
      required: [event]
      properties:
        event: { type: string, enum: [hello, records], description: The SSE event name. }
        newest: { type: integer, format: int64 }
        size: { type: integer }
        version: { type: string }
        ids: { type: array, items: { type: string } }
        at: { type: integer, format: int64 }
    PrefsEvent:
      type: object
      required: [type]
      additionalProperties: true
      properties:
        type: { type: string, enum: [hello, changed] }
        revision: { type: integer }
        stamps: { type: object, additionalProperties: { type: integer, format: int64 } }
        applied: { type: array, items: { type: string }, description: "The sections the other client wrote." }
        by: { type: string }
    PrefSection:
      type: object
      required: [value]
      properties:
        value: {}
        updatedAt: { type: integer, format: int64 }
        by: { type: string }
    Prefs:
      type: object
      required: [ok, revision]
      properties:
        ok: { type: boolean }
        revision: { type: integer }
        sections:
          type: object
          additionalProperties: { $ref: '#/components/schemas/PrefSection' }
        stamps:
          type: object
          additionalProperties: { type: integer, format: int64 }
    PrefsWrite:
      type: object
      required: [sections]
      properties:
        sections:
          type: object
          additionalProperties: { $ref: '#/components/schemas/PrefSection' }
        by: { type: string, description: "Which client is writing." }
    PrefsWriteResult:
      type: object
      required: [ok, revision]
      additionalProperties: true
      properties:
        ok: { type: boolean }
        revision: { type: integer }
        applied: { type: array, items: { type: string } }
        kept: { type: array, items: { type: string } }

    RunEvent:
      type: object
      required: [type]
      additionalProperties: true
      properties:
        seq: { type: integer }
        type: { type: string }
        at: { type: integer, format: int64 }
        payload: { $ref: '#/components/schemas/AnyObject' }
    TeamRun:
      type: object
      required: [id]
      additionalProperties: true
      properties:
        id: { type: string }
        client: { type: string }
        team: { $ref: '#/components/schemas/AnyObject' }
        status: { type: string }
        events: { type: array, items: { $ref: '#/components/schemas/RunEvent' } }
    TeamRunCreate:
      type: object
      properties:
        id: { type: string }
        client: { type: string, description: "Which client is running it." }
        team: { $ref: '#/components/schemas/AnyObject' }
        request: { $ref: '#/components/schemas/AnyObject' }

    Project:
      type: object
      required: [id]
      additionalProperties: true
      properties:
        id: { type: string }
        status: { type: string }
        jobs: { type: array, items: { $ref: '#/components/schemas/AnyObject' } }

    Skill:
      type: object
      required: [id]
      additionalProperties: true
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        promptChars: { type: integer }
        prompt: { type: string, description: "Only on `GET /skills/{skillId}`." }
