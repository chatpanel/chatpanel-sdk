  /v1/capabilities:
    get:
      operationId: capabilities.list
      tags: [capabilities]
      summary: What this provider can do — which capabilities, models, measured cost and runtime state.
      description: |
        The discovery document a client chooses a provider from: one entry per capability
        (`detect`, `stt`, `tts` today; `decide`, `rerank`, `embed` as they land), each at its
        standard route, with the models it can serve, the loaded model's own label vocabulary
        (`detect`), the measured latency record, and the runtime's state. Never loads a model.
      x-chatpanel-auth: open
      x-chatpanel-since: '0.13.0'
      responses:
        '200':
          description: The provider's capabilities.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapabilitiesDocument' }

  # ------------------------------------------------------------------ runtime
  /v1/runtime:
    get:
      operationId: runtime.status
      tags: [runtime]
      summary: The runtime — the process sandbox, what is running now, the container engine, the services.
      description: |
        One document for Settings › Runtime. `sandbox` is the bridge's own (`/health.sandbox`:
        enabled, mode `open` | `allowlist` | `none`, the runtime found, the reason when none,
        the global `extras`, whether a process can get a session of its own, and `refused` —
        the last hosts any process was refused, names only). `processes` lists every local
        MCP server running for the user with its sandbox record and the hosts it was refused,
        and the warm agent processes. `engines` says which container engine exists (`podman`
        first, `docker`) and whether it can run a container now; when none does, `install`
        carries the command for this platform — shown to the person, never run by the gateway.
        `services` is the catalogue: `searxng` with its state (`no-engine` | `engine-stopped`
        | `absent` | `stopped` | `running`), its loopback URL and whether it answers.
      x-chatpanel-auth: open
      x-chatpanel-since: '0.19.0'
      responses:
        '200':
          description: The runtime document.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuntimeDocument' }

  /v1/runtime/engines/{name}:
    post:
      operationId: runtime.engine
      tags: [runtime]
      summary: Start the container engine (Podman — creates and starts its machine where one is needed).
      description: |
        `{ action: 'start' }`. Podman on macOS and Windows runs containers in a machine: made
        on first start (`podman machine init`), then started. Linux Podman is rootless and
        needs nothing. Docker is not started by the gateway — the response says so.
      x-chatpanel-auth: token
      x-chatpanel-since: '0.19.0'
      security: [{ gatewayToken: [] }, { tokenHeader: [] }]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string, enum: [podman, docker], maxLength: 16 } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                action: { type: string, enum: [start], default: start }
      responses:
        '200': { description: Started, or already running (`already: true`)., content: { application/json: { schema: { $ref: '#/components/schemas/RuntimeActionResult' } } } }
        '400': { description: Could not start; `install` when the engine is not installed., content: { application/json: { schema: { $ref: '#/components/schemas/RuntimeActionResult' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/runtime/services/{id}:
    post:
      operationId: runtime.service
      tags: [runtime]
      summary: Start or stop a catalogue service, or pick a capability container's model — each runs loopback-only and the gateway points at it.
      description: |
        `{ action: 'start' | 'stop' }`. `start` brings the engine up if it is not, runs the
        service's container from its kit (SearXNG: `127.0.0.1:8888`, JSON on, the limiter off,
        a random secret, capabilities dropped; `reranker` on 8889 and `opendecision` on 8890
        with the shared model cache mounted, gateway 0.20+) — the first start pulls the image
        — waits for it to answer, and sets the config that points the gateway at it
        (`search.searxng.url`; `capabilities.rerank` / `capabilities.decide`, so `/v1/rerank`
        and `/v1/decide` are served and listed). `stop` stops the container and clears what it
        set. `{ action: 'model', model }` (gateway 0.22+) picks the model a capability
        container runs — an id from its catalogue (`GET /v1/runtime` `services.<id>.models`)
        or a Hugging Face `owner/name` — gated by the container ENGINE's memory (a model it
        cannot hold is refused with the command that raises the ceiling); the container is
        re-created with the pick and restarted when it ran.
      x-chatpanel-auth: token
      x-chatpanel-since: '0.19.0'
      security: [{ gatewayToken: [] }, { tokenHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, enum: [searxng, reranker, opendecision], maxLength: 32 } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                action: { type: string, enum: [start, stop, model], default: start }
                model: { type: string, description: "With `action: model` — a catalogue id or a Hugging Face owner/name." }
      responses:
        '200': { description: Done; `url` and `answering` on a start., content: { application/json: { schema: { $ref: '#/components/schemas/RuntimeActionResult' } } } }
        '400': { description: Could not; `install` when there is no engine., content: { application/json: { schema: { $ref: '#/components/schemas/RuntimeActionResult' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/detect:
    post:
      operationId: capabilities.detect
      tags: [capabilities]
      summary: Find entities in text — the model's own labels, with offsets and scores.
      description: |
        The standard `detect` signature over the in-process entity detector. Labels are the
        model's own (`private_person`, `PER`, `GIVENNAME`…) — the client maps them; the
        vocabulary is listed by `GET /v1/capabilities`. `budgetMs` is refused (503
        `over_budget`) from the provider's own latency record before the model runs, never
        missed. An engine that is still loading answers 503 `detector_unready`; an empty
        `entities` on 200 means the model found nothing. Raw text reaches the model here and
        nowhere else — this route is loopback-only like the rest of the gateway.
      x-chatpanel-auth: open
      x-chatpanel-since: '0.13.0'
      x-chatpanel-scope: the request text, in this process
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DetectRequest' }
      responses:
        '200':
          description: The spans found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetectResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503':
          description: The detector is not ready (`detector_unready`, `detector_error`) or the budget cannot be met (`over_budget`, with `predictedMs` and `budgetMs`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /v1/rerank:
    post:
      operationId: capabilities.rerank
      tags: [capabilities]
      summary: Order documents by relevance to a query — a cross-encoder, no language model.
      description: |
        The Cohere / Jina rerank shape, served BY PROXY: the gateway forwards to the reranker
        it is pointed at — the `reranker` container started under Settings › Runtime (Text
        Embeddings Inference with `BAAI/bge-reranker-v2-m3`, loopback-only), or the server
        `capabilities.rerank` names — through the adapter that speaks its wire, and validates
        the answer against the contract before it leaves (a wrong shape is 502 `bad_shape`,
        never a bad order). `budgetMs` is refused (503 `over_budget`) from the gateway's own
        latency record before dialling. 404 `no_provider` until a provider is configured;
        503 `provider_unavailable` when it does not answer. `GET /v1/capabilities` lists it
        only while configured.
      x-chatpanel-auth: open
      x-chatpanel-since: '0.20.0'
      x-chatpanel-scope: the query and the documents, to the configured reranker
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RerankRequest' }
      responses:
        '200':
          description: The documents' indexes, best first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RerankResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '404':
          description: No reranker is configured (`no_provider`), or the model asked for is not the one served (`model_not_found`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '502':
          description: The provider answered but not in the contract's shape (`bad_shape`) or with an error (`provider_error`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: The provider did not answer (`provider_unavailable`) or the budget cannot be met (`over_budget`, with `predictedMs` and `budgetMs`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /v1/decide:
    post:
      operationId: capabilities.decide
      tags: [capabilities]
      summary: Typed decisions over a text — a choice, a score or a yes/no, each with a probability.
      description: |
        ChatPanel's `decide` signature (docs/capability-endpoints.md §4.2): `state` is the text
        judged, `questions` are keyed by identifier — a `choice` picks one of its `options`, a
        `score` places the state on `options` read as an ordered rubric, a `noul` is yes/no.
        Served BY PROXY through the adapter the config names: the `opendecision` container
        started under Settings › Runtime (TypeSafe's `/v1/systemone` shape, loopback-only), or
        a server `capabilities.decide` names (a Jev endpoint with a token, another gateway).
        `calibrated` in the response says whether `p` may be read as a probability — an NLI
        concentration (OpenDecision) is not one. Errors as `/v1/rerank`.
      x-chatpanel-auth: open
      x-chatpanel-since: '0.20.0'
      x-chatpanel-scope: the state text and the questions, to the configured decision model
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecideRequest' }
      responses:
        '200':
          description: An answer per question.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecideResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '404':
          description: No decision model is configured (`no_provider`), or the model asked for is not the one served (`model_not_found`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '502':
          description: The provider answered but not in the contract's shape (`bad_shape`) or with an error (`provider_error`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: The provider did not answer (`provider_unavailable`) or the budget cannot be met (`over_budget`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /v1/search:
    post:
      operationId: retrieval.search
      tags: [retrieval]
      summary: Search the web through the provider this gateway is configured with; optionally read the top results in the same request.
      description: |
        The `search` capability (docs/web-retrieval.md §4.1). Providers are listed by
        `GET /v1/capabilities`: `serp` (a results page fetched and read with the shared rules —
        no install, the default) and `searxng` (the user's own metasearch, preferred the moment it
        answers). `read: N` reads the top N results in parallel in this request, each carrying a
        §4.2 document under `read` — one round-trip instead of 1 + N; a page that will not be read
        keeps its snippet with `read.restricted.reason`. The query goes through layer-1 redaction
        (emails, cards, keys, dictionary terms — never the name detector) before it leaves; what
        was replaced is dropped and `redacted: true` says so; a query with nothing left is 400
        `unsafe_query`. `freshness` and `lang` are honoured by SearXNG; `site` by both. `budgetMs`
        covers the search and its reads and is refused (503 `over_budget`) from the provider's
        record. `engines` names what was actually asked, so an empty list can be told from a
        blocked one.
      x-chatpanel-auth: open
      x-chatpanel-since: '0.15.0'
      x-chatpanel-scope: the query (after layer-1 redaction), to the configured provider; the top pages when `read` is set
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebSearchRequest' }
      responses:
        '200':
          description: Ranked results — possibly none, with `engines` naming what was asked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebSearchResponse' }
        '400':
          description: A bad body (`invalid_request`), or a query that was only private values (`unsafe_query`).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '404':
          description: The named provider is not available here (`provider_not_found`).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '502':
          description: The provider failed (`provider_failed` — a SearXNG 403/429 names the settings fix).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '503':
          description: The budget cannot be met (`over_budget`).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '504':
          description: The provider did not answer within the budget (`fetch_timeout`).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /v1/search/{q}:
    get:
      operationId: retrieval.searchAlias
      tags: [retrieval]
      summary: The s.jina.ai-shaped alias — `GET /v1/search/<query>` — the top results WITH their content.
      description: |
        Same search as `POST /v1/search` with `read: 5` (`?read=N`, 0–10, changes it), answered
        in the shape the shipped ChatPanel extension's *Web search API* engine already reads:
        `{ code, status, data: [{ url, title, description, content, publishedTime? }] }` where
        `content` is the page's Markdown when it was read and the snippet otherwise — nothing
        needs fetching on the client. A Bearer token is accepted and ignored.
      x-chatpanel-auth: open
      x-chatpanel-since: '0.15.0'
      x-chatpanel-scope: the query (after layer-1 redaction), to the configured provider; the top pages
      parameters:
        - { name: q, in: path, required: true, schema: { type: string, maxLength: 1024 }, description: "The query, percent-encoded." }
        - { name: read, in: query, required: false, schema: { type: integer, minimum: 0, maximum: 10, default: 5 } }
      responses:
        '200':
          description: The results with content.
          content:
            application/json:
              schema:
                type: object
                required: [code, status, data]
                properties:
                  code: { type: integer }
                  status: { type: integer }
                  data:
                    type: array
                    items:
                      type: object
                      required: [url, title, description, content]
                      properties:
                        url: { type: string }
                        title: { type: string }
                        description: { type: string }
                        content: { type: string }
                        publishedTime: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
        '504': { $ref: '#/components/responses/Error' }
  /v1/extract:
    post:
      operationId: retrieval.extract
      tags: [retrieval]
      summary: A document's pages from its bytes — a PDF, a Word file, a sheet, a deck — parsed once, paged by hash.
      description: |
        The `extract` capability (docs/capability-endpoints.md): the third leg beside `search`
        and `read`. Two calls on one route. With `name` and `data` (the file, base64), the
        document is parsed in a worker process on this machine — no network, the vault
        unreadable — and the answer is its identity (`hash`, SHA-256 of the bytes), its `type`
        as read from the bytes, its `title` when it has one and how many `pages` it has; the
        text stays on the server. With `hash` and `page`, one page's text comes back; the
        bytes crossed once. A page is the format's own unit (a PDF page, a slide, a sheet) or,
        for a document with none (DOCX, Markdown, text), a run of ~6,000 characters cut at a
        heading. Readers: PDF (pdf.js, the text layer — a scanned document is `scanned: true`
        with empty pages, never OCR'd), DOCX (Markdown), XLSX/ODS (rows of cells), PPTX/ODP
        (a slide per page, speaker notes appended), ODT, Markdown, text, CSV, HTML. A hash the
        worker no longer holds (it is dropped when idle) is a 404 `unknown_document`: send the
        bytes again. `budgetMs` is refused (503 `over_budget`) from the worker's own record.
      x-chatpanel-auth: open
      x-chatpanel-since: '0.16.0'
      x-chatpanel-scope: one document, parsed on this machine, never sent anywhere
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExtractRequest' }
      responses:
        '200':
          description: The document opened (hash, type, pages) — or, with `page`, that page's text.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtractResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '404':
          description: The hash is not open in the worker (`unknown_document`) — send the bytes again.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '413':
          description: The document is over the 64 MB limit (`too_large`).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '415':
          description: No reader for these bytes (`unsupported`).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '503':
          description: The budget cannot be met (`over_budget`, with `predictedMs`).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '504':
          description: The parse took too long and the worker was restarted (`extract_timeout`).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /v1/read:
    post:
      operationId: retrieval.read
      tags: [retrieval]
      summary: Read one public page as LLM-ready Markdown, cited where it landed, with its sections.
      description: |
        The `read` capability (docs/web-retrieval.md §4.2). The page is fetched from this
        machine as the user's agent — public web only (the shared SSRF guard, re-checked
        where a redirect lands), a browser User-Agent, no cookies — and turned into Markdown
        that keeps headings, lists, tables, code and links. `url` in the answer is where the
        page should be CITED: the same-origin canonical when it declares one, else where the
        fetch landed; `sections` are the page's own heading ids with their offset into the
        content so a citation can point at `url#section`. A page that could not be read as
        the article — a login wall, a paywall, a 429 — is a 200 with `restricted.reason` and
        the caller's `snippet` standing in for the content, never the wall rendered as prose.
        `maxChars` cuts at a section boundary. A read is served from this process's page
        cache when fresh (`cached: true`), revalidated with its ETag when stale. `budgetMs`
        is refused (503 `over_budget`) from the provider's own record, never missed. Providers
        are listed by `GET /v1/capabilities`: `defuddle` (in-process), `text` (the DOM-less
        fallback), `remote` (an `r.jina.ai`-shaped reader configured under `read.remote`).
      x-chatpanel-auth: open
      x-chatpanel-since: '0.14.0'
      x-chatpanel-scope: one public page, fetched on request
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReadRequest' }
      responses:
        '200':
          description: The page — or, with `restricted` set, the reason it was not read and the snippet in its place.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '404':
          description: The named provider is not available here (`provider_not_found`).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '415':
          description: The page is not HTML or text (`unsupported_content`).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '502':
          description: The page could not be fetched (`fetch_failed`), or its host — or where it redirected — is not public web (`blocked_host`).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '503':
          description: The budget cannot be met (`over_budget`, with `predictedMs` and `budgetMs`).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '504':
          description: The page did not answer within the budget (`fetch_timeout`).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /v1/read/{url}:
    get:
      operationId: retrieval.readAlias
      tags: [retrieval]
      summary: The r.jina.ai-shaped alias — `GET /v1/read/https://…` — for clients that already speak it.
      description: |
        Same read as `POST /v1/read`, addressed the way the shipped ChatPanel extension's
        *reader service* slot (and anything else built for `r.jina.ai`) already addresses a
        reader: the page URL appended to the base, as is or percent-encoded, with its own
        query string kept. Answers `text/plain` with `Title:` / `URL Source:` / `Published
        Time:` header lines, a blank line and `Markdown Content:`; under
        `Accept: application/json` the §4.2 document wrapped as `{ code, status, data }`.
        `X-Return-Format: text` selects the text form. A Bearer token is accepted and ignored.
      x-chatpanel-auth: open
      x-chatpanel-since: '0.14.0'
      x-chatpanel-scope: one public page, fetched on request
      parameters:
        - { name: url, in: path, required: true, schema: { type: string, maxLength: 4096 }, description: "The page URL, as is or percent-encoded." }
        - { name: Accept, in: header, required: false, schema: { type: string }, description: "`application/json` for the document; text otherwise." }
        - { name: X-Return-Format, in: header, required: false, schema: { type: string, enum: [markdown, text] } }
      responses:
        '200':
          description: The page.
          content:
            text/plain:
              schema: { type: string }
            application/json:
              schema:
                type: object
                required: [code, status, data]
                properties:
                  code: { type: integer }
                  status: { type: integer }
                  data: { $ref: '#/components/schemas/ReadResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
        '504': { $ref: '#/components/responses/Error' }

  /v1/engines:
    get:
      operationId: engines.list
      tags: [engines]
      summary: Every engine's card.
      x-chatpanel-auth: open
      x-chatpanel-since: '0.6.89'
