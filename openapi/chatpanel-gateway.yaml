      - $ref: '#/components/parameters/JobId'
    get:
      operationId: projects.applications
      tags: [projects]
      summary: The pool applies at once; `prompt` is the evaluator's, for a structured call.
      x-chatpanel-auth: open
      x-chatpanel-since: '0.6.90'
      parameters:
        - { name: reach, in: query, schema: { type: string, default: any } }
        - { name: chatModel, in: query, schema: { type: string } }
      responses:
        '200':
          description: Applications.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnyObject' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/projects/{projectId}/jobs/{jobId}/recruit:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/JobId'
    post:
      operationId: projects.recruit
      tags: [projects]
