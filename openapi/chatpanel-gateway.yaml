openapi: 3.1.0
# ---------------------------------------------------------------------------------------
# ChatPanel Gateway — the client contract.
#
# THIS FILE IS THE SOURCE OF TRUTH FOR EVERY SDK IN THIS REPO. The TypeScript and Python
# surfaces are generated from it (tools/gen-core.mjs); the long-tail languages are generated
# from it with openapi-generator (tools/generate.mjs). A route that is not here is not in any
# SDK, and a route added here reaches every language on the next `npm run generate`.
#
# Rules (the hub's "Tesla rule"): the gateway evolves continuously, clients update slowly, so
# every change to this contract is ADDITIVE — a new operation, a new optional field, a new
# optional parameter. Never rename, never remove, never make an optional field required.
#
# Per-operation extensions the generators read:
#   x-chatpanel-auth    open  — any loopback caller may call it (the product's data plane)
#                       token — the gateway token (~/.chatpanel/gateway-token, or a paired
#                               client's copy) is required; the gateway answers 403 otherwise
#   x-chatpanel-since   the gateway version that introduced the route, when its source says
#                       so. An SDK checks GET /health once and refuses the call on an older
#                       gateway with "your gateway is X; this needs Y" instead of letting it
#                       fall through to the model proxy as "upstream fetch failed".
#   x-chatpanel-stream  sse — text/event-stream; the SDK exposes it as an event iterator.
#   x-chatpanel-scope   a human label for what the operation reaches (docs + audit).
# ---------------------------------------------------------------------------------------
info:
  title: ChatPanel Gateway API
  version: 0.35.0
  summary: The local privacy gateway's HTTP API — chat, history, memory, preferences, teams, projects, skills.
  description: |
    The ChatPanel gateway runs on the user's machine (loopback only, port 4320 by default). It
    redacts personal data before a model sees it, routes model traffic, and holds the user's
    searchable history, durable memory, shared preferences and the team/project run boards.

    **It only answers on loopback.** A client on another host cannot reach it; an SDK refuses a
    non-loopback base URL unless the integrator opts in and uses TLS.

    **Two trust levels.** The `/v1` data plane is open to any local process — that is the
    product. Writes that change what every client sees (remember, forget, ingest) and anything
    admin-shaped require the per-install token the gateway writes to
    `~/.chatpanel/gateway-token` (mode 0600), or a copy obtained by pairing (`POST /pair` with
    a one-time code from `chatpanel-gateway pair`). `POST /whoami` says which trust you have.

    **Errors** are `{ error: { message, type } }` (or `{ error: "text" }` on the oldest routes)
    with the HTTP status. `type` is a stable machine word: `not_found`, `invalid_request`,
    `unknown_endpoint`, `unavailable`, `bridge_unreachable`, `no_bridge`, `redact_error`,
    `search_error`, `memory_error`, `team_error`, `ingest_error`, `prefs_error`.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  contact:
    name: ChatPanel
    url: https://chatpanel.net

servers:
  - url: http://127.0.0.1:4320
    description: The local gateway. Loopback only.

security:
  - {}
  - gatewayToken: []

tags:
  - name: gateway
    description: Liveness, identity and pairing.
  - name: models
    description: What the gateway can route to.
  - name: fusions
    description: Several models as one — union, draft + target, fallback.
  - name: audio
    description: Speech in and out, OpenAI-shaped, over the gateway's own engines or its table's provider.
  - name: chat
    description: The OpenAI-compatible chat endpoint, redacted and routed by the gateway.
  - name: redaction
    description: Preview what the model would receive.
  - name: history
    description: The user's searchable history — chats, notes, meetings, briefs.
  - name: memory
    description: Durable facts about the user, carried into every turn on every client.
  - name: prefs
    description: The settings every client shares.
  - name: teams
    description: Team runs — the board every client can read.
  - name: projects
    description: The project record — the page a goal starts on and everything done for it.
  - name: agents
    description: Attested per-agent scorecards.
  - name: a2a
    description: Remote agents reached over the Agent2Agent protocol — discovery, messages, tasks.
  - name: engines
    description: The model ledger — every engine's card.
  - name: capabilities
    description: The small non-generative models this gateway provides — discovery, and one standard signature per capability (docs/capability-endpoints.md).
  - name: skills
    description: The skills on this machine (served through the bridge).
  - name: retrieval
    description: Web retrieval — search through the provider the user chose, and a page as LLM-ready Markdown, cited where it landed, with its sections (docs/web-retrieval.md).
  - name: runtime
    description: What runs processes for the user and how — the process sandbox (through the bridge), the container engine on this machine, and the services the gateway runs for the user (docs/sandboxing.md S1).
  - name: events
    description: The durable event log, merged across every client and served as one CloudEvents 1.0 stream — metadata only (refs and counts, never content), ordered by `(host, seq)` and `causes`, never by clock (docs/event-stream-sync.md E1).

paths:
  # ------------------------------------------------------------------ gateway
  /health:
    get:
      operationId: gateway.health
      tags: [gateway]
      summary: Liveness, version and capabilities.
      description: Additive fields only. `version` is what every version gate reads.
      x-chatpanel-auth: open
      responses:
        '200':
          description: The gateway is up.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /whoami:
    post:
      operationId: gateway.whoami
      tags: [gateway]
      summary: What the gateway makes of this caller.
      x-chatpanel-auth: open
      x-chatpanel-since: '0.9.0'
      responses:
        '200':
          description: The caller's trust class.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WhoAmI' }
  /pair/code:
    post:
      operationId: gateway.pairCode
      tags: [gateway]
      summary: Mint a one-time pairing code (5 minutes, one use, 5 attempts).
      description: Only a caller that already holds the token may mint one — pairing widens nothing.
      x-chatpanel-auth: token
      x-chatpanel-since: '0.9.0'
      security: [{ gatewayToken: [] }, { tokenHeader: [] }]
      responses:
        '200':
          description: The code to carry into the client.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PairingCode' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /pair:
    post:
      operationId: gateway.pair
      tags: [gateway]
      summary: Exchange a pairing code for the gateway token.
      x-chatpanel-auth: open
      x-chatpanel-since: '0.9.0'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: "The 6-digit code from `chatpanel-gateway pair`." }
      responses:
        '200':
          description: Paired. Store the token where only this user can read it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Paired' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /audit:
    get:
      operationId: gateway.audit
      tags: [gateway]
      summary: The egress audit — which hosts this gateway has contacted and which its config allows.
      description: The checkable claim behind "nothing leaves the machine". Admin-gated because it names the user's model endpoints.
      x-chatpanel-auth: token
      security: [{ gatewayToken: [] }, { tokenHeader: [] }]
      responses:
        '200':
          description: The audit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Audit' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ------------------------------------------------------------------ models / chat
  /v1/models:
    get:
      operationId: models.list
      tags: [models]
      summary: Every model the gateway can route to.
      description: |
        Describes the routing table, not the disk: a bridge agent is listed whether or not the
        CLI is installed. From 0.6.64 each agent carries `available`; from 0.6.66 a cloud model
        carries `configured: false` when a turn is known to fail for something the user can fix.
      x-chatpanel-auth: open
      responses:
        '200':
          description: The list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelList' }
  /v1/chat/completions:
    post:
      operationId: chat.completions
      tags: [chat]
      summary: One chat turn through the gateway (OpenAI-compatible).
      description: |
        Redacted on the way out, restored on the way back, routed by `model`. With `stream: true`
        the response is `text/event-stream` of OpenAI chunk objects ending in `data: [DONE]`.
        Send `tools` so a redacted turn can still act: the gateway relays a tool call back with
        real arguments and redacts the result. `X-ChatPanel-Redaction: off` is honoured only from
        a token-bearing caller (0.6.69+) and is recorded in the trace.

        **Permission prompts (gateway 0.25.0+).** List a function tool named `permission_prompt`
        to say your client can answer an agent's "may I run this?" — the gateway strips it from
        what the agent sees and lets the agent ask instead of denying headlessly. The question
        arrives as a `tool_calls` stop on that tool, its arguments `{ tool, input, description,
        path, rules }`; answer with a `tool` message whose content is the JSON
        `{ "behavior": "allow" | "deny", "scope": "once" | "chat", "message"?: string }`.
        Anything else is a deny.

        **Two lanes.** An API destination (a cloud or local model endpoint) is a proxy hop and is
        open to any local caller. An AGENT destination (`codex`, `claude`, `opencode`, … —
        `provider_type: agent` in `GET /v1/models`) spawns a process on this machine, so the
        caller must hold the gateway token (0.9.0+): without it the gateway answers **401**
        `{ type: 'auth', code: 'agent_lane_token_required' }`. The SDKs surface that as
        `ForbiddenError` with `status` 401.
      x-chatpanel-auth: open
      x-chatpanel-stream: sse-when-stream
      parameters:
        - $ref: '#/components/parameters/RedactionHeader'
        - $ref: '#/components/parameters/RunHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatCompletionRequest' }
      responses:
        '200':
          description: The completion, or a stream of chunks.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatCompletion' }
            text/event-stream:
              schema: { type: string, description: '`data: {chunk}` frames; `data: [DONE]` ends it.' }
              x-chatpanel-frame: { $ref: '#/components/schemas/ChatCompletionChunk' }
        '401':
          description: An agent destination was asked for by a caller without the gateway token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '4XX': { $ref: '#/components/responses/Error' }
        '5XX': { $ref: '#/components/responses/Error' }

  # ------------------------------------------------------------------ redaction
  /redact:
    post:
      operationId: redaction.preview
      tags: [redaction]
      summary: What the model would receive if this text were sent now.
      description: Runs the same redaction path as a real turn. The reply carries placeholder types, never the real values.
      x-chatpanel-auth: open
      x-chatpanel-since: '0.6.62'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
      responses:
        '200':
          description: The redacted text and what was replaced.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RedactionPreview' }
        '500': { $ref: '#/components/responses/Error' }

  # ------------------------------------------------------------------ history
  /v1/history/search:
    post:
      operationId: history.search
      tags: [history]
      summary: One keyword query over the warm index.
      x-chatpanel-auth: open
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchRequest' }
      responses:
        '200':
          description: Ranked snippets.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResponse' }
        '400': { $ref: '#/components/responses/Error' }
  /v1/history/smart-search:
    post:
      operationId: history.smartSearch
      tags: [history]
      summary: Several phrasings at once, rank-fused; briefs lead.
      x-chatpanel-auth: open
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SmartSearchRequest' }
      responses:
        '200':
          description: Fused results and the queries that were run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SmartSearchResponse' }
        '400': { $ref: '#/components/responses/Error' }
  /v1/history/related:
    get:
      operationId: history.related
      tags: [history]
      summary: The records most connected to one record.
      x-chatpanel-auth: open
      parameters:
        - { name: id, in: query, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 30, default: 5 } }
      responses:
        '200':
          description: Neighbours.
          content:
            application/json:
              schema:
                type: object
                required: [ok, results]
                properties:
                  ok: { type: boolean }
                  results: { type: array, items: { $ref: '#/components/schemas/SearchHit' } }
  /v1/history/status:
    get:
      operationId: history.status
      tags: [history]
      summary: Size and freshness of the warm index (and the lossless tier from 0.10.0).
      x-chatpanel-auth: open
      responses:
        '200':
          description: Status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HistoryStatus' }
  /v1/history/list:
    get:
      operationId: history.list
      tags: [history]
      summary: A page of the warm index — metadata only, no bodies.
      x-chatpanel-auth: open
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/RecordType' } }
      responses:
        '200':
          description: The page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HistoryPage' }
  /v1/history/get:
    get:
      operationId: history.get
      tags: [history]
      summary: One full warm record, optionally paged by characters.
      x-chatpanel-auth: open
      parameters:
        - { name: id, in: query, required: true, schema: { type: string } }
        - { name: maxChars, in: query, schema: { type: integer, minimum: 1 }, description: "Page a long transcript instead of pulling it all." }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: The record.
          content:
            application/json:
              schema:
                type: object
                required: [ok, record]
                properties:
                  ok: { type: boolean }
                  record: { $ref: '#/components/schemas/HistoryRecord' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/history/records:
    get:
      operationId: history.records
      tags: [history]
      summary: WHOLE records changed after a stamp, oldest first, paged by cursor, tombstones included.
      description: The lossless tier. A gateway without the SQLite store answers 501.
      x-chatpanel-auth: open
      x-chatpanel-since: '0.10.0'
      parameters:
        - { name: since, in: query, schema: { type: integer, format: int64, minimum: 0, default: 0 }, description: "A stamp (ms since epoch) from a previous page's `newest`." }
        - { name: cursor, in: query, schema: { type: string }, description: "Opaque; from the previous page." }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, default: 200 } }
        - { name: kind, in: query, schema: { type: string } }
      responses:
        '200':
          description: A page of whole records.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordsPage' }
        '501': { $ref: '#/components/responses/Error' }
    put:
      operationId: history.putRecords
      tags: [history]
      summary: Push whole records; the gateway derives the searchable text itself.
      x-chatpanel-auth: token
      x-chatpanel-since: '0.10.0'
      security: [{ gatewayToken: [] }, { tokenHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PutRecordsRequest' }
      responses:
        '200':
          description: What was written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PutRecordsResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '501': { $ref: '#/components/responses/Error' }
  /v1/history/stream:
    get:
      operationId: history.stream
      tags: [history]
      summary: Live record changes — `hello` once, then a `records` event per change.
      x-chatpanel-auth: open
      x-chatpanel-since: '0.11.0'
      x-chatpanel-stream: sse
      responses:
        '200':
          description: '`event: hello` `{ newest, size, version }`, then `event: records` `{ newest, size, ids, at }`; a comment ping every 25 s.'
          content:
            text/event-stream:
              schema: { type: string }
              x-chatpanel-frame: { $ref: '#/components/schemas/HistoryStreamEvent' }
        '501': { $ref: '#/components/responses/Error' }
  # ------------------------------------------------------------------ events
  /v1/events:
    post:
      operationId: events.push
      tags: [events]
      summary: Push a batch of this client's durable log as CloudEvents; each event is appended once, each refusal is named.
      description: >-
        Idempotent on event id, so a retry is free. A `seq` that moves backwards for a host under a new id is a
        corrupt writer and is refused by itself; the rest of the batch lands. Push what lies above your entry in
        `cursor` (the gateway's highest `seq` per host) and stop re-sending what `rejected` names. At most 2000
        events per batch. A gateway without SQLite answers 501.
      x-chatpanel-auth: token
      x-chatpanel-since: '0.24.0'
      security: [{ gatewayToken: [] }, { tokenHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushEventsRequest' }
      responses:
        '200':
          description: What the batch did, and the cursor afterwards.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushEventsResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/Error' }
        '501': { $ref: '#/components/responses/Error' }
    get:
      operationId: events.since
      tags: [events]
      summary: The merged log above a cursor — host by host in `seq` order, as CloudEvents, paged.
      x-chatpanel-auth: token
      x-chatpanel-since: '0.24.0'
      security: [{ gatewayToken: [] }, { tokenHeader: [] }]
      parameters:
        - { name: cursor, in: query, schema: { type: string }, description: "JSON `{ host: seq }` — the highest seq per host you already hold. Absent means everything." }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 1000 } }
        - { name: host, in: query, schema: { type: string }, description: "One host's slice only." }
      responses:
        '200':
          description: A page; re-ask with the returned `cursor` while `more` is true.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventsPage' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '501': { $ref: '#/components/responses/Error' }
  /v1/events/cursor:
    get:
      operationId: events.cursor
      tags: [events]
      summary: The gateway's highest `seq` per host — what a client asks for before it pushes.
      x-chatpanel-auth: token
      x-chatpanel-since: '0.24.0'
      security: [{ gatewayToken: [] }, { tokenHeader: [] }]
      responses:
        '200':
          description: The cursor and the log's size.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventsCursor' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '501': { $ref: '#/components/responses/Error' }
  /v1/events/stats:
    get:
      operationId: events.stats
      tags: [events]
      summary: What the merged log measures — bytes and events per turn, per surface, per host and per day; the dedup hit-rate; tool calls; a year projected against the cap.
      x-chatpanel-auth: token
      x-chatpanel-since: '0.25.1'
      security: [{ gatewayToken: [] }, { tokenHeader: [] }]
      responses:
        '200':
          description: The numbers, over the retained log (at most the last 25 000 events).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventsStats' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '501': { $ref: '#/components/responses/Error' }
  /v1/events/stream:
    get:
      operationId: events.stream
      tags: [events]
      summary: Tail the merged log — `hello` once, then a `cloudevent` frame per appended event; with `cursor`, the backlog above it first.
      x-chatpanel-auth: token
      x-chatpanel-since: '0.24.0'
      x-chatpanel-stream: sse
      security: [{ gatewayToken: [] }, { tokenHeader: [] }]
      parameters:
        - { name: cursor, in: query, schema: { type: string }, description: "JSON `{ host: seq }`; when present the events above it are replayed before live frames." }
      responses:
        '200':
          description: '`event: hello` `{ cursor, count, version }`, then `event: cloudevent` with one CloudEvents 1.0 JSON object as data; a comment ping every 25 s. A reader appends by id, so a duplicate on the wire is harmless.'
          content:
            text/event-stream:
              schema: { type: string }
              x-chatpanel-frame: { $ref: '#/components/schemas/EventsStreamEvent' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '501': { $ref: '#/components/responses/Error' }
  /v1/history/ingest:
    post:
      operationId: history.ingest
      tags: [history]
      summary: Push flattened (lossy) records into the warm index.
      x-chatpanel-auth: token
      security: [{ gatewayToken: [] }, { tokenHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IngestRequest' }
      responses:
        '200':
          description: The index size after the write.
          content:
            application/json:
              schema:
                type: object
                required: [ok, size]
                properties:
                  ok: { type: boolean }
                  size: { type: integer }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ------------------------------------------------------------------ memory
  /v1/memory/list:
    get:
      operationId: memory.list
      tags: [memory]
      summary: Every memory.
      x-chatpanel-auth: open
      responses:
        '200':
          description: The list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryList' }
  /v1/memory/recall:
    post:
      operationId: memory.recall
      tags: [memory]
      summary: The memories relevant to a text, and a prompt block that carries them.
      x-chatpanel-auth: open
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecallRequest' }
      responses:
        '200':
          description: Relevant memories.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecallResponse' }
        '400': { $ref: '#/components/responses/Error' }
  /v1/memory/remember:
    post:
      operationId: memory.remember
      tags: [memory]
      summary: Save a durable fact. Never anonymous — `source` is recorded.
      x-chatpanel-auth: token
      security: [{ gatewayToken: [] }, { tokenHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RememberRequest' }
      responses:
        '200':
          description: What happened — added, updated, or replaced an older memory.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RememberResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/memory/forget:
    post:
      operationId: memory.forget
      tags: [memory]
      summary: Forget memories matching an id or words.
      x-chatpanel-auth: token
      security: [{ gatewayToken: [] }, { tokenHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string }
      responses:
        '200':
          description: How many were removed.
          content:
            application/json:
              schema:
                type: object
                required: [ok, removed, size]
                properties:
                  ok: { type: boolean }
                  removed: { type: integer }
                  size: { type: integer }
