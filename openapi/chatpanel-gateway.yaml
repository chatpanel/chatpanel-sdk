            schema: { $ref: '#/components/schemas/AnyObject' }
      responses:
        '200':
          description: The entry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnyObject' }
        '400': { $ref: '#/components/responses/Error' }

  # ------------------------------------------------------------------ skills
  /skills-quarantined:
    get:
      operationId: skills.quarantined
      tags: [skills]
      summary: Packages the admission scanner refused — what is on disk and deliberately not listed.
      description: >-
        A skill package is a prompt that will run with tools attached, so it is scanned before
        it is admitted. One that fails is kept out of `GET /skills` entirely; this is the only
        way to learn it exists, and why. The bridge has implemented it since packages could
        arrive; nothing could reach it until 0.48.0.
      x-chatpanel-auth: open
      x-chatpanel-since: '0.48.0'
      parameters:
        - { name: workdir, in: query, schema: { type: string } }
      responses:
        '200':
          description: The refused packages.
          content:
            application/json:
              schema:
                type: object
                required: [quarantined]
                properties:
                  quarantined: { type: array, items: { $ref: '#/components/schemas/QuarantinedSkill' } }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /a2a/card:
    post:
      operationId: a2a.card
      tags: [a2a]
      summary: Fetch a remote agent's card, revalidating the one already held.
      description: >-
        The gateway is the only component allowed to reach a remote agent: every outbound host
        goes through its SSRF guard, and a card names the endpoints this machine will then
        talk to. Cached per §8.6 — an ETag is revalidated with `If-None-Match`, so `fresh:
        false` means the peer answered 304 and the card is unchanged. Plain HTTP is refused
        for a remote host; loopback is not.
      x-chatpanel-auth: token
      x-chatpanel-since: '0.53.0'
      x-chatpanel-scope: the remote agent's origin
      security: [{ gatewayToken: [] }, { tokenHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, description: "The agent's origin, or a card URL outright." }
                force: { type: boolean, description: "Skip the TTL and revalidate — the ETag is still sent." }
                forget: { type: boolean, description: "Drop the cached card first." }
                auth: { type: string, description: "An Authorization header value for agents that need one." }
      responses:
        '200':
          description: The card.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  card: { $ref: '#/components/schemas/AgentCard' }
                  fingerprint: { type: string, description: "Changes when the card's content does." }
                  fresh: { type: boolean, description: "false when the peer answered 304." }
                  changed: { type: boolean }
                  url: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /a2a/message:
    post:
      operationId: a2a.message
      tags: [a2a]
      summary: Send a message to a remote agent and wait for the answer.
      description: >-
        The reply is a TASK or a MESSAGE — an agent that can answer at once returns a message
        and no task is ever created, so `kind` says which. `text` and `needs` are derived here
        rather than by each caller: `needs` is `answer` for an input stop and `approval` for an
        authorization one, and telling a caller to send a message when approval is wanted is
        how a task sits forever with both ends waiting.
      x-chatpanel-auth: token
      x-chatpanel-since: '0.53.0'
      x-chatpanel-scope: the remote agent's endpoint
      security: [{ gatewayToken: [] }, { tokenHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/A2ASendRequest' }
      responses:
        '200':
          description: The answer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/A2AResult' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /a2a/message/stream:
    post:
      operationId: a2a.stream
      tags: [a2a]
      summary: Send a message and stream the answer as it is produced.
      description: >-
        Server-sent events, one per protocol frame — `task`, `status`, `artifact`, `message`,
        then `done` with the final result (or `error`). Each event carries the task as it
        stands, so a chunked artifact arrives whole rather than as fragments the caller must
        reassemble. Requires the agent to advertise `capabilities.streaming`.
      x-chatpanel-auth: token
      x-chatpanel-since: '0.53.0'
      x-chatpanel-stream: sse
      x-chatpanel-scope: the remote agent's endpoint
      security: [{ gatewayToken: [] }, { tokenHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/A2ASendRequest' }
      responses:
        '200':
          description: An event stream.
          content:
            text/event-stream:
              schema: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /a2a/task:
    post:
      operationId: a2a.task
      tags: [a2a]
      summary: Poll or cancel a task on a remote agent.
      x-chatpanel-auth: token
      x-chatpanel-since: '0.53.0'
      x-chatpanel-scope: the remote agent's endpoint
      security: [{ gatewayToken: [] }, { tokenHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string }
                url: { type: string }
                card: { $ref: '#/components/schemas/AgentCard' }
                cancel: { type: boolean, description: "Cancel instead of polling." }
                auth: { type: string }
      responses:
        '200':
          description: The task.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/A2AResult' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /a2a/agents:
    get:
      operationId: a2a.agents
      tags: [a2a]
      summary: Every remote agent this gateway has spoken to.
      description: What the audit lists — an agent a person connected is a host this machine talks to.
      x-chatpanel-auth: token
      x-chatpanel-since: '0.53.0'
      security: [{ gatewayToken: [] }, { tokenHeader: [] }]
      responses:
        '200':
          description: The agents.
          content:
            application/json:
              schema:
                type: object
                required: [agents]
                properties:
                  agents: { type: array, items: { type: object, additionalProperties: true } }
        '403': { $ref: '#/components/responses/Error' }
  /agent-defs:
    get:
      operationId: agents.listDefs
      tags: [agents]
      summary: The agent definitions on this machine, from every tool that writes one.
      description: >-
        `.claude/agents/*.md`, `.codex/agents/*.toml`, `~/.chatpanel/agents/*.json` and the
        project-local equivalents, each read in its own dialect and returned in one shape. No
        prompts — `promptChars` only, for the same reason `GET /skills` omits them.
      x-chatpanel-auth: open
      x-chatpanel-since: '0.48.0'
      parameters:
        - { name: workdir, in: query, schema: { type: string }, description: "Also read this project's own agent folders, ahead of the home ones." }
        - { name: dir, in: query, schema: { type: string }, description: "An extra absolute folder to scan. Repeatable." }
      responses:
        '200':
          description: The definitions.
          content:
            application/json:
              schema:
                type: object
                required: [agents]
                properties:
                  agents: { type: array, items: { $ref: '#/components/schemas/AgentDef' } }
                  quarantined: { type: array, items: { type: object, additionalProperties: true }, description: "Definitions the scanner refused." }
                  problems: { type: array, items: { type: object, additionalProperties: true }, description: "Files that parsed as a definition and could not be made one." }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /agent-defs/{agentId}:
    parameters:
      - { name: agentId, in: path, required: true, schema: { type: string, maxLength: 200, pattern: '^[^/\\]+$' }, description: "One path segment; slashes and `..` are refused." }
    get:
      operationId: agents.getDef
      tags: [agents]
      summary: One agent definition, prompt included.
      x-chatpanel-auth: open
      x-chatpanel-since: '0.48.0'
      parameters:
        - { name: workdir, in: query, schema: { type: string } }
      responses:
        '200':
          description: The definition.
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent: { $ref: '#/components/schemas/AgentDef' }
                  dialect: { type: string, enum: [chatpanel, claude, codex, a2a] }
                  source: { type: string }
                  path: { type: string }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /agent-defs/export-plan:
    post:
      operationId: agents.exportPlan
      tags: [agents]
      summary: What an export would write, and what the target cannot carry — without writing it.
      description: >-
        A separate call from the export itself, deliberately: "show me what you are about to do
        to my Claude Code directory" is a question a person answers before saying yes, and a dry
        run sharing a code path with the real thing is one edit away from not being dry.
      x-chatpanel-auth: token
      x-chatpanel-since: '0.48.0'
      security: [{ gatewayToken: [] }, { tokenHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentExportRequest' }
      responses:
        '200':
          description: The plan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentExportPlan' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /agent-defs/export:
    post:
      operationId: agents.exportDef
      tags: [agents]
      summary: Write an agent definition into another tool's folder.
      description: >-
        Only from a named action. The file is backed up before it is touched, and one ChatPanel
        did not write — or one edited since it did — is refused with `NOT_OURS` unless
        `overwrite` is set. Which of those applies is what `export-plan` reports as `status`.
      x-chatpanel-auth: token
      x-chatpanel-since: '0.48.0'
      security: [{ gatewayToken: [] }, { tokenHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentExportRequest' }
      responses:
        '200':
          description: Written.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  path: { type: string }
                  to: { type: string }
                  backedUp: { type: boolean }
                  status: { type: string, enum: [new, ours, theirs] }
                  fidelity: { $ref: '#/components/schemas/AgentFidelity' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /skills:
    get:
      operationId: skills.list
      tags: [skills]
      summary: The skills on this machine — with a prompt character count, not the prompt.
      x-chatpanel-auth: open
      x-chatpanel-since: '0.6.64'
      parameters:
        - { name: workdir, in: query, schema: { type: string }, description: "Include the project-local skill roots of this directory (0.9.4+)." }
      responses:
        '200':
          description: Skills.
          content:
            application/json:
              schema:
                type: object
                required: [skills]
                properties:
                  skills: { type: array, items: { $ref: '#/components/schemas/Skill' } }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /skills/{skillId}:
    parameters:
      - { name: skillId, in: path, required: true, schema: { type: string, maxLength: 200, pattern: '^[^/\\]+$' }, description: "One path segment; slashes and `..` are refused." }
    get:
      operationId: skills.get
      tags: [skills]
      summary: One skill, with its prompt.
      x-chatpanel-auth: open
      x-chatpanel-since: '0.6.67'
      parameters:
        - { name: workdir, in: query, schema: { type: string } }
      responses:
        '200':
          description: The skill.
          content:
            application/json:
              schema:
                type: object
                required: [skill]
                properties:
                  skill:
                    oneOf:
                      - $ref: '#/components/schemas/Skill'
                      - type: 'null'
        '400': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }

  # ── audio ──────────────────────────────────────────────────────────────────────────────
  /v1/audio/transcriptions:
    post:
      operationId: audio.transcribe
      tags: [audio]
      summary: Transcribe an audio file (OpenAI-compatible).
      description: |
        OpenAI's shape over the gateway's own transcriber — the in-process whisper, or the
        provider its capability table names (a hosted API, a container the Runtime started).
        A WAV is decoded by the gateway itself; mp3/m4a/webm/ogg/flac go through `ffmpeg` when it
        is on the gateway's PATH, else 415 says so. Beyond OpenAI: `diarize=true` puts a
        `speaker` on every segment of `verbose_json`. The live microphone keeps the session API
        (`/stt/sessions`); this is for a file.
      x-chatpanel-since: '0.34.0'
      x-chatpanel-auth: open
      x-chatpanel-sdk: manual
      x-chatpanel-scope: the audio leaves the machine only when the table's STT provider is remote
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: 'WAV (any rate, channels, 8/16/24/32-bit or float), or any format ffmpeg reads.' }
                model: { type: string, description: 'Ignored — the gateway transcribes with what its table says; kept for OpenAI clients.' }
                language: { type: string, description: 'ISO code; auto-detected when absent.' }
                response_format: { type: string, enum: [json, text, verbose_json], default: json }
                diarize: { type: string, enum: ['true', 'false'], description: 'A speaker per segment (verbose_json).' }
      responses:
        '200':
          description: The transcript.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transcription' }
            text/plain:
              schema: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }

  /v1/audio/speech:
    post:
      operationId: audio.speech
      tags: [audio]
      summary: Text to speech (OpenAI-compatible) — a WAV back.
      description: |
        `{ input, voice?, speed?, response_format? }` → `audio/wav`, from the gateway's own
        voice (Kokoro / VITS in-process) or the provider its table names (an ElevenLabs or
        OpenAI voice — then the text leaves the machine, and the audit says so). Not redacted:
        synthesis is for the person who wrote the text. `/tts` is the same handler with `text`.
      x-chatpanel-since: '0.6.60'
      x-chatpanel-auth: open
      x-chatpanel-sdk: manual
      x-chatpanel-scope: the text leaves the machine only when the table's TTS provider is remote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input]
              properties:
                input: { type: string, maxLength: 20000 }
                voice: { type: string, description: 'A local voice id, or the remote provider’s; the configured default when absent.' }
                speed: { type: number, minimum: 0.5, maximum: 2, default: 1 }
                response_format: { type: string, enum: [wav], default: wav, description: 'WAV is what the local engine makes.' }
      responses:
        '200':
          description: The audio.
          content:
            audio/wav:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  # ── fusions ────────────────────────────────────────────────────────────────────────────
  /v1/fusions:
    get:
      operationId: fusions.list
      tags: [fusions]
      summary: Several models as one — the fusions this gateway has.
      description: |
        Derived from state (the entity detector's union once a companion is ready, an engine
        drafting with a second model) and composed by the user (`POST /config { fusions }`, a
        chat fallback in order). A chat turn names a fallback as `model: "fusion:<id>"` and is
        routed to the first member that is up; `x-chatpanel-fusion` on the response says which.
      x-chatpanel-since: '0.33.0'
      x-chatpanel-auth: open
      responses:
        '200':
          description: The kinds and the fusions, each described.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FusionList' }

components:
  securitySchemes:
    gatewayToken:
      type: http
      scheme: bearer
      description: The per-install token at `~/.chatpanel/gateway-token` (0600), or the copy a paired client received.
    tokenHeader:
      type: apiKey
      in: header
      name: X-ChatPanel-Token
      description: The same token, for a client that cannot set Authorization.

  parameters:
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string, pattern: '^[a-zA-Z0-9_-]{4,64}$' }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, pattern: '^[a-zA-Z0-9_-]{1,64}$' }
    JobId:
      name: jobId
      in: path
      required: true
      schema: { type: string, pattern: '^[a-zA-Z0-9_-]{1,64}$' }
    RedactionHeader:
      name: X-ChatPanel-Redaction
      in: header
      required: false
      schema: { type: string, enum: [off] }
      description: Turn redaction off for this turn — honoured only from a token-bearing caller (0.6.69+), recorded in the trace.
    RunHeader:
      name: X-ChatPanel-Run
      in: header
      required: false
      schema: { type: string }
      description: A team role's run context (URL-encoded JSON) for the bridge (0.6.89+). Never a token.

  responses:
    Error:
      description: An error, in the gateway's words.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: The caller lacks the token this route needs.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Removed:
      description: Whether the record existed.
      content:
        application/json:
          schema:
            type: object
            required: [ok, removed]
            properties:
              ok: { type: boolean }
              removed: { type: boolean }
    TeamRunResult:
      description: The run as it now stands.
      content:
        application/json:
          schema:
            type: object
            required: [ok, run]
            properties:
              ok: { type: boolean }
              run: { $ref: '#/components/schemas/TeamRun' }
    ProjectResult:
      description: The project as it now stands.
      content:
        application/json:
          schema:
            type: object
            required: [ok, project]
            properties:
              ok: { type: boolean }
              project: { $ref: '#/components/schemas/Project' }

  schemas:
    AnyObject:
      type: object
      additionalProperties: true
      description: A domain object whose shape is owned by `@chatpanel/events`; the SDK carries it as-is.

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          oneOf:
            - type: string
            - type: object
              required: [message]
              properties:
                message: { type: string }
                type: { type: string, description: "A stable machine word — `not_found`, `invalid_request`, `unavailable`, `auth`, `policy`, …" }
                code: { type: string, description: "A finer word when there is one — `agent_lane_token_required`, `org_policy`." }

    Health:
      type: object
      required: [ok, version]
      additionalProperties: true
      properties:
        ok: { type: boolean }
        version: { type: string, description: "The gateway's semver; every version gate reads this." }
        backend: { type: string }
        tier: { type: string, enum: [basic, full], description: "Redaction tier." }
        pairing: { type: boolean, description: "Present from 0.9.0 — this gateway can pair a client." }
        managed: { $ref: '#/components/schemas/AnyObject' }
        managedBy: { type: string }
        bridge: { $ref: '#/components/schemas/AnyObject' }
        stt: { $ref: '#/components/schemas/AnyObject' }
        tts: { $ref: '#/components/schemas/AnyObject' }

    WhoAmI:
      type: object
      required: [ok, trust, paired, version]
      properties:
        ok: { type: boolean }
        trust: { type: string, enum: [token, pinned, unpaired, local, web] }
        paired: { type: boolean, description: "True when this caller may reach token-gated routes." }
        version: { type: string }

    PairingCode:
      type: object
      required: [ok, code, expiresAt]
      properties:
        ok: { type: boolean }
        code: { type: string }
        display: { type: string }
        expiresAt: { type: integer, format: int64, description: "ms since epoch" }

    Paired:
      type: object
      required: [ok, token]
      properties:
        ok: { type: boolean }
        token: { type: string, description: "The gateway token. A secret — store it 0600 or in the platform keychain; never log it." }
        bridgeToken: { type: string, description: "The bridge's token when this machine has one." }

    Audit:
      type: object
      additionalProperties: true
      properties:
        version: { type: string }
        startedAt: { type: integer, format: int64 }

    Model:
      type: object
      required: [id, object]
      additionalProperties: true
      properties:
        id: { type: string }
        object: { type: string, enum: [model] }
        owned_by: { type: string }
        provider: { type: string }
        provider_type: { type: string, enum: [agent, openai, anthropic], description: "0.6.64+" }
        api: { type: string }
        endpoints: { type: array, items: { type: string } }
        available: { type: boolean, description: "0.6.64+ for bridge agents — whether the CLI is installed." }
        configured: { type: boolean, description: "0.6.66+ — false when a turn is known to fail for something the user can fix." }
        reason: { type: string }
        tools: { type: boolean, description: "False when the agent cannot take per-turn tools." }
        reach: { type: string, enum: [device, trusted, any], description: "0.40.0+ — where the model runs, which is what a privacy ceiling reads: `device` on this machine, `trusted` on the private network, `any` a cloud. For a coding agent it is where its MODEL is (Codex → OpenAI is `any`; OpenCode over Ollama is `device`), never where the CLI process runs. Every row is served on the gateway's loopback address, so the address says nothing — read this field." }
    ModelList:
      type: object
      required: [object, data]
      properties:
        object: { type: string, enum: [list] }
        data: { type: array, items: { $ref: '#/components/schemas/Model' } }

    ChatMessage:
      type: object
      required: [role]
      additionalProperties: true
      properties:
        role: { type: string, enum: [system, user, assistant, tool] }
        content:
          oneOf:
            - type: string
            - type: array
              items: { $ref: '#/components/schemas/ChatContentPart' }
            - type: 'null'
        name: { type: string }
        tool_calls: { type: array, items: { $ref: '#/components/schemas/AnyObject' } }
        tool_call_id: { type: string }
    ChatContentPart:
      type: object
      required: [type]
      additionalProperties: true
      description: One part of a multi-part message — `text`, `image_url`, … in the OpenAI shape.
      properties:
        type: { type: string }
        text: { type: string }
        image_url: { $ref: '#/components/schemas/AnyObject' }
    ChatCompletionRequest:
      type: object
      required: [model, messages]
      additionalProperties: true
      properties:
        model: { type: string, description: 'A model id from `GET /v1/models`; `claude/opus` names an agent and its model.' }
        messages: { type: array, items: { $ref: '#/components/schemas/ChatMessage' } }
        stream: { type: boolean }
        stream_options: { $ref: '#/components/schemas/AnyObject' }
        tools: { type: array, items: { $ref: '#/components/schemas/AnyObject' } }
        tool_choice: {}
        temperature: { type: number }
        max_tokens: { type: integer }
    ChatCompletion:
      type: object
      required: [id, object, choices]
      additionalProperties: true
      properties:
        id: { type: string }
        object: { type: string }
        created: { type: integer }
        model: { type: string }
        choices:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              index: { type: integer }
              message: { $ref: '#/components/schemas/ChatMessage' }
              finish_reason: { type: [string, 'null'] }
        usage: { $ref: '#/components/schemas/AnyObject' }
    ChatCompletionChunk:
      type: object
      required: [id, object, choices]
      additionalProperties: true
      description: One `data:` frame of a streamed completion.
      properties:
        id: { type: string }
        object: { type: string }
        model: { type: string }
        choices:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              index: { type: integer }
              delta: { $ref: '#/components/schemas/AnyObject' }
              finish_reason: { type: [string, 'null'] }
        usage: { $ref: '#/components/schemas/AnyObject' }

    RuntimeDocument:
      type: object
      description: The runtime — Settings › Runtime's one document (docs/sandboxing.md S1).
      properties:
        sandbox: { $ref: '#/components/schemas/AnyObject', description: "the bridge's /health.sandbox: enabled, mode, runtime, reason?, extras, ownSessions, refused[] (names only), provisioned? (Windows)" }
        processes:
          type: object
          properties:
            all: { type: array, items: { $ref: '#/components/schemas/AnyObject' }, description: "every process running for the user — the bridge's (kind agent | warm | mcp | probe) and the gateway's own workers (kind worker): id, kind, engine, command (basename), label, pid, since, sandbox (the record), refused[] — never argv or env (0.19.1)" }
            localMcp: { type: array, items: { $ref: '#/components/schemas/AnyObject' }, description: "id, command (basename), pid, since, sandbox (the record), refused[] — never argv or env" }
            warm: { $ref: '#/components/schemas/AnyObject' }
        containers: { type: array, items: { $ref: '#/components/schemas/AnyObject' }, description: "every container the engine has, running or not: name, image, state, status, ports[], ours (a chatpanel- name), engine (0.19.1)" }
        refused: { type: array, items: { $ref: '#/components/schemas/AnyObject' }, description: "{ id, engine, host, at } newest first" }
        bridge: { type: object, properties: { ok: { type: boolean }, version: { type: string } } }
        engines: { $ref: '#/components/schemas/AnyObject', description: "podman/docker: { installed, version?, running?, machine? }; preferred; install? { command, url, note }" }
        services: { $ref: '#/components/schemas/AnyObject', description: "Per catalogue service (searxng · reranker · opendecision): { id, label, image, container, port, blurb, provides, engine, state, url, configured, answering } — a capability container also { model, default, models: [{ id, label, lang, tier, approxMB, ramMB, licence, recommended, installed, note, unavailable?, ramNote? }], machine: { engineRamMB } } (gateway 0.22+)." }
    RuntimeActionResult:
      type: object
      properties:
        ok: { type: boolean }
        error: { type: string }
        already: { type: boolean }
        url: { type: string }
        answering: { type: boolean }
        install: { $ref: '#/components/schemas/AnyObject' }
        provides: { type: array, items: { type: string }, description: "The capabilities the service now stands behind (gateway 0.20+)." }
        model: { type: string, description: "The model the container runs, on a start or a model pick (gateway 0.22+)." }
        restarted: { type: boolean, description: "A model pick re-created a running container." }
        note: { type: string, description: "A model pick that fits but is tight for the engine's memory." }
      required: [ok]
    CapabilitiesDocument:
      type: object
      required: [capabilities, server]
      properties:
        capabilities:
          type: array
          items: { $ref: '#/components/schemas/Capability' }
        server:
          type: object
          required: [name, version]
          properties:
            name: { type: string }
            version: { type: string }
            audit: { type: string, description: "Where this provider's egress audit is served." }
    Capability:
      type: object
      required: [id, route]
      properties:
        id: { type: string, enum: [detect, decide, rerank, embed, stt, tts, search, read] }
        route: { type: string, description: "The standard route for this capability on this provider." }
        models: { type: array, items: { type: string }, description: "Model capabilities (detect, decide, rerank, embed, stt, tts): the models offered. Required for those." }
        providers: { type: array, items: { type: string }, description: "Provider capabilities (search, read): the providers offered — a SearXNG, a SERP scraper, an extractor. Required for those." }
        default: { type: string, description: "One of `models`, or of `providers`." }
        labels: { type: array, items: { type: string }, description: "detect: the loaded model's label vocabulary, BIOES prefixes stripped. Empty until a model is loaded." }
        maxTokens: { type: [integer, 'null'], description: "detect: the tokenizer's limit; null when effectively unbounded." }
        requirements: { $ref: '#/components/schemas/AnyObject' }
        stats: { $ref: '#/components/schemas/CapabilityStats' }
        runtime: { $ref: '#/components/schemas/AnyObject', description: "state (off | loading | downloading | ready | error | external), name, dtype, error…" }
        streaming: { type: string, description: "stt: the session route for live dictation." }
        voices: { type: string, description: "tts: the voices route." }
    CapabilityStats:
      type: object
      required: [calls]
      properties:
        calls: { type: integer }
        p50Ms: { type: number }
        p95Ms: { type: number }
        maxMs: { type: number }
        lastMs: { type: number }
        charsPerSec: { type: [number, 'null'] }
    DetectRequest:
      type: object
      required: [text]
      properties:
        text: { type: string }
        model: { type: string, description: "A model this provider lists; 404 otherwise." }
        labels: { type: array, items: { type: string }, description: "Keep only these of the model's labels." }
        budgetMs: { type: number, minimum: 0, description: "Refused before running if the provider's record predicts it cannot be met." }
    DetectedEntity:
      type: object
      required: [value, type, start, end, score]
      properties:
        value: { type: string }
        type: { type: string, description: "The model's own label." }
        start: { type: integer, description: "Character offset into the request text." }
        end: { type: integer }
        score: { type: number, minimum: 0, maximum: 1 }
    DetectResponse:
      type: object
      required: [entities, model, ms]
      properties:
        entities: { type: array, items: { $ref: '#/components/schemas/DetectedEntity' } }
        model: { type: string }
        ms: { type: number }
        runtime: { $ref: '#/components/schemas/AnyObject' }
    RerankRequest:
      type: object
      required: [query, documents]
      properties:
        query: { type: string, minLength: 1 }
        documents: { type: array, items: { type: string }, minItems: 1, maxItems: 1000 }
        top_n: { type: integer, minimum: 1, description: "Return only the best this many." }
        model: { type: string, description: "The model this provider serves; 404 otherwise." }
        budgetMs: { type: number, minimum: 0, description: "Refused before dialling if the gateway's record predicts it cannot be met." }
    RerankResult:
      type: object
      required: [index, relevance_score]
      properties:
        index: { type: integer, minimum: 0, description: "Into the request's documents." }
        relevance_score: { type: number }
    RerankResponse:
      type: object
      required: [results, model, ms]
      properties:
        results: { type: array, items: { $ref: '#/components/schemas/RerankResult' }, description: "Distinct indexes, best first; at most top_n." }
        model: { type: string }
        ms: { type: number }
    DecideOption:
      type: object
      required: [value]
      properties:
        value: { type: string }
        describe: { type: string, description: "What the option means — travels to the model as its criterion." }
    DecideQuestion:
      type: object
      required: [type, instructions]
      properties:
        type: { type: string, enum: [choice, score, noul] }
        instructions: { type: string, minLength: 1 }
        options:
          type: array
          minItems: 2
          maxItems: 255
          items:
            oneOf:
              - { type: string }
              - { $ref: '#/components/schemas/DecideOption' }
          description: "choice: the values to pick from; score: the rubric, in order. A noul has none."
    DecideRequest:
      type: object
      required: [state, questions]
      properties:
        state: { type: string, minLength: 1, description: "The text judged." }
        questions:
          type: object
          minProperties: 1
          additionalProperties: { $ref: '#/components/schemas/DecideQuestion' }
          description: "Keyed by identifier ([A-Za-z_][A-Za-z0-9_]*)."
        model: { type: string, description: "The model this provider serves; 404 otherwise." }
        budgetMs: { type: number, minimum: 0 }
    DecideAnswerOption:
      type: object
      required: [value, p]
      properties:
        value: { description: "A string (choice, score rubric entry) or a boolean (noul)." }
        p: { type: number, minimum: 0, maximum: 1 }
    DecideAnswer:
      type: object
      required: [value, p, options]
      properties:
        value: { description: "choice: the option picked; score: a number on the rubric; noul: a boolean." }
        p: { type: number, minimum: 0, maximum: 1, description: "The probability of `value` — read it as one only when the response says `calibrated`." }
        options: { type: array, items: { $ref: '#/components/schemas/DecideAnswerOption' }, description: "The whole distribution." }
        confidence: { type: number, minimum: 0, maximum: 1, description: "The provider's own confidence, when it reports one." }
    DecideResponse:
      type: object
      required: [answers, model, ms]
      properties:
        answers:
          type: object
          additionalProperties: { $ref: '#/components/schemas/DecideAnswer' }
          description: "One per question asked, under the same key."
        model: { type: string }
        ms: { type: number }
        calibrated: { type: boolean, description: "Whether `p` is a calibrated probability. false for a zero-shot NLI concentration." }
    WebSearchRequest:
      type: object
      required: [q]
      properties:
        q: { type: string, minLength: 1 }
        limit: { type: integer, minimum: 1, maximum: 50, default: 8 }
        lang: { type: string, description: "en or en-US; honoured by SearXNG." }
        site: { type: string, description: "A hostname — the site: operator." }
        freshness: { type: string, enum: [day, week, month, year], description: "Honoured by SearXNG (time_range); week maps to month." }
        read: { type: integer, minimum: 0, maximum: 10, default: 0, description: "Read the top N results in this request." }
        provider: { type: string, description: "One of the providers `GET /v1/capabilities` lists for `search`; 404 otherwise." }
        budgetMs: { type: number, minimum: 0 }
    WebSearchResult:
      type: object
      required: [rank, url, title, snippet]
      properties:
        rank: { type: integer, minimum: 1 }
        url: { type: string }
        title: { type: string }
        snippet: { type: string }
        engine: { type: string, description: "The engine that produced it (SearXNG: the first of `engines`; serp: the results page asked)." }
        engines: { type: array, items: { type: string }, description: "SearXNG: every engine that returned it." }
        score: { type: number, description: "SearXNG's fused score." }
        publishedDate: { type: string }
        read: { $ref: '#/components/schemas/ReadResponse', description: "Present for the top `read` results." }
    WebSearchResponse:
      type: object
      required: [results, provider, ms]
      properties:
        results: { type: array, items: { $ref: '#/components/schemas/WebSearchResult' } }
        answers: { type: array, items: { type: string }, description: "SearXNG's direct answers, when it had any." }
        suggestions: { type: array, items: { type: string } }
        engines: { type: array, items: { type: string }, description: "What was actually asked." }
        unresponsive: { type: array, items: { type: string }, description: "SearXNG engines that did not answer." }
        redacted: { type: boolean, description: "Layer-1 redaction removed something from the query." }
        query: { type: string, description: "The query as sent, when `redacted`." }
        provider: { type: string }
        ms: { type: number }
    ExtractRequest:
      type: object
      description: "Either `name` + `data` (open a document) or `hash` + `page` (read one page of an open document)."
      properties:
        name: { type: string, description: "The file name — its extension helps tell office formats apart." }
        type: { type: string, description: "The client's guess at the type (e.g. `pdf`, `docx`); the bytes decide." }
        data: { type: string, format: byte, description: "The whole file, base64. At most 64 MB decoded." }
        hash: { type: string, pattern: '^[0-9a-f]{64}$', description: "The `hash` an open call returned." }
        page: { type: integer, minimum: 1, description: "The page to read, 1-based." }
        budgetMs: { type: number, minimum: 0, description: "Refused before parsing if the worker's record predicts it cannot be met." }
    ExtractResponse:
      type: object
      required: [hash, type, pages, provider, ms]
      properties:
        hash: { type: string, pattern: '^[0-9a-f]{64}$', description: "SHA-256 of the bytes — the document's identity for page calls." }
        type: { type: string, description: "What the bytes are: pdf, docx, xlsx, pptx, odt, ods, odp, md, txt, csv, html." }
        pages: { type: integer, minimum: 0 }
        title: { type: string, description: "The document's own title, when it declares one; else empty." }
        scanned: { type: boolean, description: "A PDF with no text layer: its pages are empty and need OCR, which this does not do." }
        page: { type: integer, minimum: 1, description: "Present on a page call." }
        text: { type: string, description: "The page's text, on a page call. May be empty." }
        provider: { type: string, description: "`chatpanel-extract`." }
        ms: { type: number }
    ReadRequest:
      type: object
      required: [url]
      properties:
        url: { type: string, description: "Absolute http(s) URL of a public page." }
        format: { type: string, enum: [markdown, text], default: markdown }
        maxChars: { type: integer, minimum: 200, description: "Cut at a section boundary near this length; `truncated` says so." }
        snippet: { type: string, description: "A search snippet to stand in for the content when the page cannot be read." }
        provider: { type: string, description: "One of the providers `GET /v1/capabilities` lists for `read`; 404 otherwise." }
        budgetMs: { type: number, minimum: 0, description: "Refused before fetching if the provider's record predicts it cannot be met." }
    ReadSection:
      type: object
      required: [id, heading, level, offset]
      properties:
        id: { type: string, description: "The page's own heading id when it has one, else a slug — cite as `url#id`." }
        heading: { type: string }
        level: { type: integer, minimum: 1, maximum: 6 }
        offset: { type: integer, description: "Character offset of the heading line into the content." }
    ReadRestriction:
      type: object
      required: [reason]
      properties:
        reason: { type: string, enum: [login, paywall, rate_limited, robots, tdm], description: "`robots` and `tdm` come only from a hosted (crawler) provider; on the user's machine the reader is a user agent." }
        detail: { type: string }
    ReadResponse:
      type: object
      required: [url, title, format, chars, truncated, sections, provider, ms]
      properties:
        url: { type: string, description: "Where to CITE the page: the same-origin canonical, else where the fetch landed. Fragments dropped." }
        requested: { type: string, description: "The URL that was asked for." }
        title: { type: string }
        author: { type: string }
        published: { type: string, description: "As the page declared it (ISO date or datetime when it gave one)." }
        site: { type: string, description: "The hostname of `url`." }
        lang: { type: string }
        format: { type: string, enum: [markdown, text] }
        markdown: { type: string, description: "The content, when `format` is markdown." }
        text: { type: string, description: "The content, when `format` is text." }
        chars: { type: integer, description: "Length of the content field." }
        truncated: { type: boolean }
        sections: { type: array, items: { $ref: '#/components/schemas/ReadSection' } }
        fetched: { type: string, format: date-time, description: "When the page was fetched (the cached copy's time on a cache hit)." }
        cached: { type: boolean }
        provider: { type: string }
        ms: { type: number }
        restricted: { oneOf: [{ $ref: '#/components/schemas/ReadRestriction' }, { type: 'null' }], description: "Set when the page was not read as the article; the content is then the request's `snippet`." }

    RedactionPreview:
      type: object
      required: [text, count]
      properties:
        text: { type: string, description: "What the model would receive." }
        count: { type: integer }
        sanitized: { type: integer }
        tier: { type: string, enum: [basic, full] }
        entities: { type: array, items: { $ref: '#/components/schemas/AnyObject' }, description: "Placeholder tokens and their types — never the real values." }
        detector: { $ref: '#/components/schemas/AnyObject' }

    RecordType:
      type: string
      enum: [chat, note, meeting, brief]
    SearchFilters:
      type: object
      properties:
        type: { $ref: '#/components/schemas/RecordType' }
        since: { type: integer, format: int64, description: "ms since epoch" }
        before: { type: integer, format: int64, description: "ms since epoch" }
        limit: { type: integer, minimum: 1, maximum: 50, default: 10 }
    SearchRequest:
      allOf:
        - $ref: '#/components/schemas/SearchFilters'
        - type: object
          required: [query]
          properties:
            query: { type: string }
            offset: { type: integer, minimum: 0, default: 0 }
    SmartSearchRequest:
      allOf:
        - $ref: '#/components/schemas/SearchFilters'
        - type: object
          required: [question]
          properties:
            question: { type: string, description: "The natural-language question." }
            queries: { type: array, items: { type: string }, description: "2–4 keyword phrasings of your own; they lead." }
            maxQueries: { type: integer, minimum: 1, maximum: 6, default: 4 }
    SearchHit:
      type: object
      required: [id]
      additionalProperties: true
      properties:
        id: { type: string }
        score: { type: number }
        title: { type: string }
        type: { $ref: '#/components/schemas/RecordType' }
        date: { type: integer, format: int64 }
        snippet: { type: string }
    SearchResponse:
      type: object
      required: [ok, results]
      properties:
        ok: { type: boolean }
        size: { type: integer }
        newest: { type: integer, format: int64 }
        results: { type: array, items: { $ref: '#/components/schemas/SearchHit' } }
    SmartSearchResponse:
      allOf:
        - $ref: '#/components/schemas/SearchResponse'
        - type: object
          properties:
            queries: { type: array, items: { type: string } }
    HistoryStatus:
      type: object
      required: [ok, size]
      properties:
        ok: { type: boolean }
        size: { type: integer }
        newest: { type: integer, format: int64 }
        bytes: { type: integer, format: int64 }
        lossless:
          oneOf:
            - type: object
              properties:
                records: { type: integer }
                newest: { type: integer, format: int64 }
            - type: 'null'
    HistoryItem:
      type: object
      required: [id]
      additionalProperties: true
      properties:
        id: { type: string }
        title: { type: string }
        type: { $ref: '#/components/schemas/RecordType' }
        date: { type: integer, format: int64 }
        chars: { type: integer }
    HistoryPage:
      type: object
      required: [ok, total, items]
      properties:
        ok: { type: boolean }
        total: { type: integer }
        items: { type: array, items: { $ref: '#/components/schemas/HistoryItem' } }
    HistoryRecord:
      type: object
      required: [id, text]
      additionalProperties: true
      properties:
        id: { type: string }
        title: { type: string }
        type: { $ref: '#/components/schemas/RecordType' }
        date: { type: integer, format: int64 }
        text: { type: string }
    RecordsPage:
      type: object
      required: [ok, records]
      additionalProperties: true
      properties:
        ok: { type: boolean }
        records: { type: array, items: { $ref: '#/components/schemas/AnyObject' }, description: "Whole records; a tombstone carries `deletedAt`." }
        next: { type: string, description: "The cursor for the next page — pass it as `cursor`; absent on the last page." }
        size: { type: integer }
        newest: { type: integer, format: int64 }
    CloudEvent:
      type: object
      description: >-
        One durable event in the CloudEvents 1.0 envelope. `seq`, `host`, `chatpanelv` are ChatPanel's extension
        attributes (the per-host order, the producer, the log schema version); `causes` is the comma-joined ids
        this event follows; `data` is the payload — refs and counts, never content.
      required: [specversion, id, source, type, time, seq, host, chatpanelv]
      additionalProperties: true
      properties:
        specversion: { type: string, enum: ['1.0'] }
        id: { type: string }
        source: { type: string, description: "`urn:chatpanel:host:<host>`" }
        type: { type: string, description: "`net.chatpanel.<family>.<kind>`" }
        time: { type: string, format: date-time }
        datacontenttype: { type: string }
        seq: { type: integer, minimum: 0 }
        host: { type: string }
        causes: { type: string }
        chatpanelv: { type: integer }
        data: { $ref: '#/components/schemas/AnyObject' }
    EventsCursorMap:
      type: object
      description: "`{ host: seq }` — the highest seq held per host."
      additionalProperties: { type: integer, minimum: 0 }
    PushEventsRequest:
      type: object
      required: [events]
      properties:
        events: { type: array, maxItems: 2000, items: { $ref: '#/components/schemas/CloudEvent' } }
    PushEventsResponse:
      type: object
      required: [ok, appended, duplicates, rejected, cursor]
      properties:
        ok: { type: boolean }
        appended: { type: integer }
        duplicates: { type: integer, description: "Events already held — a retry's share." }
        rejected:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              id: { type: [string, 'null'] }
              code: { type: string, description: "`CLOUDEVENT` (envelope), `SEQ` (moved backwards), or event.js's `SHAPE` / `TYPE` / `PAYLOAD` / `VERSION`." }
              message: { type: string }
        cursor: { $ref: '#/components/schemas/EventsCursorMap' }
    EventsCursor:
      type: object
      required: [ok, cursor]
      properties:
        ok: { type: boolean }
        cursor: { $ref: '#/components/schemas/EventsCursorMap' }
        count: { type: integer }
    EventsPage:
      type: object
      required: [ok, events, cursor, more]
      properties:
        ok: { type: boolean }
        events: { type: array, items: { $ref: '#/components/schemas/CloudEvent' } }
        cursor: { $ref: '#/components/schemas/EventsCursorMap', description: "Pass back as `cursor` for the next page." }
        more: { type: boolean }
    EventsStats:
      type: object
      required: [ok, stats]
      properties:
        ok: { type: boolean }
        stats:
          type: object
          additionalProperties: true
          properties:
            events: { type: integer }
            bytes: { type: integer, format: int64 }
            avgBytes: { type: integer }
            span: { type: object, additionalProperties: true }
            perDay: { type: object, additionalProperties: true }
            hosts: { type: object, additionalProperties: true }
            types: { type: object, additionalProperties: { type: integer } }
            turns: { type: object, additionalProperties: true }
            refs: { type: object, additionalProperties: true, description: "`total`, `distinct`, `dedupHitRate` (percent)." }
            toolCalls: { type: object, additionalProperties: true }
        year:
          type: [object, 'null']
          additionalProperties: true
          description: "`eventsPerYear`, `bytesPerYear`, `daysToCap` at the observed rate; null before there is a span."
    EventsStreamEvent:
      type: object
      required: [event]
      properties:
        event: { type: string, enum: [hello, cloudevent], description: The SSE event name. }
        cursor: { $ref: '#/components/schemas/EventsCursorMap' }
        count: { type: integer }
        version: { type: string }
    PutRecordsRequest:
      type: object
      properties:
        host: { type: string, maxLength: 80, description: "Who is pushing — recorded on every record." }
        at: { type: integer, format: int64 }
        records: { type: array, items: { $ref: '#/components/schemas/AnyObject' } }
        entries: { type: array, items: { $ref: '#/components/schemas/AnyObject' }, description: "Sealed backup entries, opened with the stored passphrase." }
    PutRecordsResponse:
      type: object
      required: [ok, written]
      properties:
        ok: { type: boolean }
        written: { type: integer }
        ids: { type: array, items: { type: string } }
        sealed: { type: integer }
        size: { type: integer }
    IngestRequest:
      type: object
      properties:
        upserts:
          type: array
          items:
            type: object
            required: [id, text]
            additionalProperties: true
            properties:
              id: { type: string }
              title: { type: string }
              type: { $ref: '#/components/schemas/RecordType' }
              date: { type: integer, format: int64 }
              text: { type: string }
        removes: { type: array, items: { type: string } }

    Memory:
      type: object
      required: [id, text]
      additionalProperties: true
      properties:
        id: { type: string }
        text: { type: string }
        kind: { type: string }
        scope: { type: string }
        tags: { type: array, items: { type: string } }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
        source: { $ref: '#/components/schemas/MemorySource' }
    MemorySource:
      type: object
      description: Who proposed the memory. There is no confirm dialog on a CLI, so attribution is the accountability.
      properties:
        via: { type: string, description: "The client — e.g. `sdk`, `cli`, `mcp`." }
        surface: { type: string }
        agent: { type: string }
        ref: { type: string }
    MemoryList:
      type: object
      required: [ok, memories]
      properties:
        ok: { type: boolean }
        size: { type: integer }
        memories: { type: array, items: { $ref: '#/components/schemas/Memory' } }
    RecallRequest:
      type: object
      required: [text]
      properties:
        text: { type: string }
        scopes: { type: array, items: { type: string }, default: [global] }
        limit: { type: integer }
        maxChars: { type: integer }
    RecallResponse:
      type: object
      required: [ok, memories]
      additionalProperties: true
      properties:
        ok: { type: boolean }
        size: { type: integer }
        memories: { type: array, items: { $ref: '#/components/schemas/Memory' } }
        block: { type: string, description: "A prompt block carrying the recalled memories." }
    RememberRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, description: "One short sentence." }
        kind: { type: string, default: fact }
        scope: { type: string, default: global }
        tags: { type: array, items: { type: string } }
        source: { $ref: '#/components/schemas/MemorySource' }
    RememberResponse:
      type: object
      required: [ok, action, record]
      properties:
        ok: { type: boolean }
        action: { type: string }
        record: { $ref: '#/components/schemas/Memory' }
        replaced:
          oneOf:
            - $ref: '#/components/schemas/Memory'
            - type: 'null'
        size: { type: integer }
    MemorySyncResponse:
      type: object
      required: [ok, memories]
      additionalProperties: true
      properties:
        ok: { type: boolean }
        size: { type: integer }
        memories: { type: array, items: { $ref: '#/components/schemas/Memory' } }

    HistoryStreamEvent:
      type: object
      required: [event]
      properties:
        event: { type: string, enum: [hello, records], description: The SSE event name. }
        newest: { type: integer, format: int64 }
        size: { type: integer }
        version: { type: string }
        ids: { type: array, items: { type: string } }
        at: { type: integer, format: int64 }
    PrefsEvent:
      type: object
      required: [type]
      additionalProperties: true
      properties:
        type: { type: string, enum: [hello, changed] }
        revision: { type: integer }
        stamps: { type: object, additionalProperties: { type: integer, format: int64 } }
        applied: { type: array, items: { type: string }, description: "The sections the other client wrote." }
        by: { type: string }
    PrefSection:
      type: object
      required: [value]
      properties:
        value: {}
        updatedAt: { type: integer, format: int64 }
        by: { type: string }
    Prefs:
      type: object
      required: [ok, revision]
      properties:
        ok: { type: boolean }
        revision: { type: integer }
        sections:
          type: object
          additionalProperties: { $ref: '#/components/schemas/PrefSection' }
        stamps:
          type: object
          additionalProperties: { type: integer, format: int64 }
    PrefsWrite:
      type: object
      required: [sections]
      properties:
        sections:
          type: object
          additionalProperties: { $ref: '#/components/schemas/PrefSection' }
        by: { type: string, description: "Which client is writing." }
    PrefsWriteResult:
      type: object
      required: [ok, revision]
      additionalProperties: true
      properties:
        ok: { type: boolean }
        revision: { type: integer }
        applied: { type: array, items: { type: string } }
        kept: { type: array, items: { type: string } }

    RunEvent:
      type: object
      required: [type]
      additionalProperties: true
      properties:
        seq: { type: integer }
        type: { type: string }
        at: { type: integer, format: int64 }
        payload: { $ref: '#/components/schemas/AnyObject' }
    TeamRun:
      type: object
      required: [id]
      additionalProperties: true
      properties:
        id: { type: string }
        client: { type: string }
        team: { $ref: '#/components/schemas/AnyObject' }
        status: { type: string }
        events: { type: array, items: { $ref: '#/components/schemas/RunEvent' } }
    TeamRunCreate:
      type: object
      properties:
        id: { type: string }
        client: { type: string, description: "Which client is running it." }
        team: { $ref: '#/components/schemas/AnyObject' }
        request: { $ref: '#/components/schemas/AnyObject' }

    Project:
      type: object
      required: [id]
      additionalProperties: true
      properties:
        id: { type: string }
        status: { type: string }
        jobs: { type: array, items: { $ref: '#/components/schemas/AnyObject' } }

    QuarantinedSkill:
      type: object
      additionalProperties: true
      properties:
        id: { type: string }
        path: { type: string }
        source: { type: string }
        verdict: { type: string, enum: [suspicious, dangerous] }

    AgentCard:
      type: object
      additionalProperties: true
      description: An A2A Agent Card (protocol 1.0). Unknown fields are preserved, so a card from a later spec round-trips.
      required: [name, description, version]
      properties:
        name: { type: string }
        description: { type: string }
        version: { type: string }
        supportedInterfaces:
          type: array
          items:
            type: object
            properties:
              url: { type: string }
              protocolBinding: { type: string, description: "JSONRPC, GRPC, HTTP+JSON — an open string, so an unknown binding is carried." }
              protocolVersion: { type: string }
              tenant: { type: string, description: "Echoed on every request to this interface when set." }
        provider:
          type: object
          properties: { organization: { type: string }, url: { type: string } }
        capabilities:
          type: object
          additionalProperties: true
          properties:
            streaming: { type: boolean }
            pushNotifications: { type: boolean }
            extendedAgentCard: { type: boolean }
        defaultInputModes: { type: array, items: { type: string } }
        defaultOutputModes: { type: array, items: { type: string } }
        skills: { type: array, items: { type: object, additionalProperties: true } }
        iconUrl: { type: string }
        documentationUrl: { type: string }

    A2ASendRequest:
      type: object
      description: Either `url` or `card` identifies the agent; either `text` or `message` is what to say.
      properties:
        url: { type: string }
        card: { $ref: '#/components/schemas/AgentCard' }
        text: { type: string, description: "Shorthand for a one-part text message." }
        message: { type: object, additionalProperties: true, description: "A full A2A Message." }
        contextId: { type: string, description: "Groups related interactions." }
        taskId: { type: string, description: "Continues an existing task — how an input or auth stop is answered." }
        returnImmediately: { type: boolean, description: "Do not wait for a terminal or interrupted state." }
        auth: { type: string }

    A2AResult:
      type: object
      description: The reply, plus the two facts every caller derives — done, and what a person must do.
      properties:
        ok: { type: boolean }
        kind: { type: string, enum: [task, message], description: "A2A returns one or the other; an agent answering at once creates no task." }
        task: { type: object, additionalProperties: true }
        message: { type: object, additionalProperties: true }
        text: { type: string, description: "The answer as text — artifacts first, then what the agent actually said." }
        done: { type: boolean }
        needs:
          type: string
          nullable: true
          enum: [answer, approval]
          description: "`answer` for TASK_STATE_INPUT_REQUIRED, `approval` for TASK_STATE_AUTH_REQUIRED, null otherwise."

    AgentDef:
      type: object
      required: [id]
      additionalProperties: true
      description: An agent definition, read from whichever tool's dialect wrote it.
      properties:
        id: { type: string }
        name: { type: string }
        purpose: { type: string }
        dialect: { type: string, enum: [chatpanel, claude, codex, a2a] }
        source: { type: string, description: "The folder it was read from: chatpanel, claude, codex, agents-dir, external." }
        label: { type: string }
        path: { type: string, description: "Relative to the root it was found in." }
        writable: { type: boolean }
        engine: { type: object, additionalProperties: true }
        grants: { type: array, items: { type: string } }
        skills: { type: array, items: { type: string } }
        promptChars: { type: integer }
        prompt: { type: string, description: "Only on `GET /agent-defs/{agentId}`." }
        warnings: { type: array, items: { type: string }, description: "What the dialect could not map — an unmapped tool is reported, never widened into a grant." }
        scanned: { type: object, additionalProperties: true }

    AgentExportRequest:
      type: object
      required: [agent, to]
      properties:
        agent: { $ref: '#/components/schemas/AgentDef' }
        to: { type: string, enum: [claude, codex, chatpanel], description: "The dialect to write." }
        overwrite: { type: boolean, default: false, description: "Only ever after a plan reported `theirs` and a person agreed." }

    AgentExportPlan:
      type: object
      properties:
        to: { type: string }
        label: { type: string }
        path: { type: string, description: "The exact file that would be written." }
        text: { type: string, description: "Its rendered contents." }
        exists: { type: boolean }
        status: { type: string, enum: [new, ours, theirs], description: "`theirs` means ChatPanel did not write it, or it has been edited since." }
        fidelity: { $ref: '#/components/schemas/AgentFidelity' }

    AgentFidelity:
      type: object
      description: What survives a trip into a dialect, derived from what that dialect declares it can express.
      properties:
        dialect: { type: string }
        lossless: { type: boolean }
        carried: { type: array, items: { type: string } }
        dropped:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              why: { type: string }

    Skill:
      type: object
      required: [id]
      additionalProperties: true
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        promptChars: { type: integer }
        prompt: { type: string, description: "Only on `GET /skills/{skillId}`." }

    Transcription:
      type: object
      required: [text]
      properties:
        text: { type: string }
        task: { type: string, enum: [transcribe], description: verbose_json only }
        language: { type: string, nullable: true, description: verbose_json only }
        duration: { type: number, description: 'Seconds of audio; verbose_json only.' }
        provider: { type: string, enum: [embedded, remote, container], description: 'Who transcribed; verbose_json only.' }
        took_ms: { type: integer }
        segments:
          type: array
          description: verbose_json only.
          items:
            type: object
            required: [id, start, end, text]
            properties:
              id: { type: integer }
              start: { type: number }
              end: { type: number }
              text: { type: string }
              speaker: { type: string, description: 'With diarize=true.' }
    FusionList:
      type: object
      required: [kinds, fusions]
      properties:
        kinds:
          type: object
          additionalProperties:
            type: object
            properties:
              id: { type: string }
              label: { type: string }
              gain: { type: string, enum: [recall, speed, reliability] }
              what: { type: string }
              for: { type: array, items: { type: string } }
        fusions:
          type: array
          items:
            type: object
            required: [id, kind, capability, members]
            properties:
              id: { type: string }
              kind: { type: string, enum: [union, draft, fallback] }
              capability: { type: string }
              label: { type: string }
              members:
                type: array
                items:
                  oneOf:
                    - type: string
                    - type: object
                      required: [id]
                      properties: { id: { type: string }, role: { type: string, enum: [target, draft] } }
              derived: { type: boolean, description: 'Read from the gateway’s state, not composed.' }
              source: { type: string, description: 'For a derived one: ner, or the runtime service.' }
              running: { type: boolean }
              describe: { type: string, description: 'The fusion in a sentence.' }
